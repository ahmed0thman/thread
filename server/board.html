<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Thread board</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --col: #eceff3;
  --text: #1b1f24;
  --muted: #566070;
  --border: #d9dde4;
  --border-strong: #b4bbc6;
  --accent: #1f56c4;
  --accent-hover: #1a48a6;
  --accent-bg: #e1eafb;
  --on-accent: #ffffff;
  --focus: #1f56c4;
  --scrim: rgba(15, 18, 24, 0.45);

  --did: #1d56b8;      --did-bg: #e2ebfb;
  --found: #0b6a69;    --found-bg: #dcf2f0;
  --decided: #6a3fc0;  --decided-bg: #ece5fa;
  --changed: #8a4b00;  --changed-bg: #fcebcd;
  --open: #a1235a;     --open-bg: #fbe2ed;
  --error: #b42318;    --error-bg: #fde8e6;

  --run: #1f56c4;      --run-bg: #e1eafb;
  --fin: #17703f;      --fin-bg: #dcf3e5;
  --fail: #b42318;     --fail-bg: #fde8e6;
  --end: #4f5968;      --end-bg: #e6e9ee;

  --warn: #8a5300;     --warn-bg: #fdf0d5;
  --danger: #b42318;   --danger-bg: #fde8e6;
  --ok: #17703f;
  --idea: #8a5300;
  --thread: #6a3fc0;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --r1: 4px; --r2: 6px; --r3: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317;
    --surface: #1b1e24;
    --surface-2: #23272f;
    --col: #16191e;
    --text: #e6e9ee;
    --muted: #a0aab8;
    --border: #2c313a;
    --border-strong: #454c58;
    --accent: #7fa8ff;
    --accent-hover: #9bbcff;
    --accent-bg: #1c2a49;
    --on-accent: #0b1220;
    --focus: #8db3ff;
    --scrim: rgba(0, 0, 0, 0.6);

    --did: #8fb5ff;      --did-bg: #1c2a47;
    --found: #5fd6cb;    --found-bg: #112f2d;
    --decided: #bca4f7;  --decided-bg: #2a2145;
    --changed: #f0b45c;  --changed-bg: #3a2a10;
    --open: #f294b8;     --open-bg: #3d1a2b;
    --error: #ff948b;    --error-bg: #3a1e1c;

    --run: #8fb5ff;      --run-bg: #1c2a47;
    --fin: #62d392;      --fin-bg: #14301f;
    --fail: #ff948b;     --fail-bg: #3a1e1c;
    --end: #aab3c0;      --end-bg: #272b33;

    --warn: #e8b35e;     --warn-bg: #36280f;
    --danger: #ff948b;   --danger-bg: #3a1e1c;
    --ok: #62d392;
    --idea: #e8b35e;
    --thread: #bca4f7;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13.5px/1.45 var(--sans);
  -webkit-text-size-adjust: 100%;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
.num, time, .count, .tnum { font-variant-numeric: tabular-nums; }
code, pre, .mono { font-family: var(--mono); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ---------- header and toolbar ---------- */
.top {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4) var(--s2);
}
.top h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.005em; flex: none; }
.dir {
  flex: 1 1 0; min-width: 0; display: flex; color: var(--muted);
  font: 12px var(--mono); white-space: nowrap;
}
.dir-head { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dir-tail { flex: none; }
.conn { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.conn .shape { color: var(--muted); }
.conn[data-state="online"] .shape { color: var(--ok); }
.conn[data-state="offline"] { color: var(--danger); font-weight: 600; }
.conn[data-state="offline"] .shape { color: var(--danger); }

/* ---------- project tabs ---------- */
.ptabs-wrap { flex: none; min-width: 0; padding: 0 var(--s4); border-bottom: 1px solid var(--border); margin-bottom: var(--s3); }
.ptabs { position: relative; display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; overscroll-behavior-x: contain; }
.ptab {
  position: relative; flex: none; display: inline-flex; align-items: center; gap: var(--s2); max-width: 280px; min-height: 38px;
  padding: 0 var(--s3); background: none; border: 0; border-radius: var(--r2) var(--r2) 0 0; cursor: pointer;
  color: var(--muted); font-weight: 600; white-space: nowrap;
}
.ptab:hover { color: var(--text); background: var(--surface-2); }
.ptab:focus-visible { outline-offset: -2px; }
.ptab[aria-selected="true"] { color: var(--text); background: var(--surface); }
.ptab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--s2); right: var(--s2); bottom: 0; height: 3px; border-radius: 2px 2px 0 0; background: var(--accent); }
.pt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ptab[data-missing] .pt-name, .ptab[data-missing] .count { opacity: 0.7; }
.ptab[data-missing] .pt-name { font-style: italic; }
.pt-miss { flex: none; font-size: 11.5px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border-radius: var(--r1); padding: 0 6px; line-height: 18px; }
.ptab .shape { width: 8px; height: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.notice { margin: 0 var(--s4) var(--s3); flex: none; }
.notice .confirm-text { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.notice code { font-size: 12.5px; overflow-wrap: anywhere; }

.gate { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: var(--s4); background: var(--bg); overflow-y: auto; }
.gate-card { width: min(460px, 100%); padding: var(--s5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r3); }
.gate-card h1 { margin: 0 0 var(--s3); font-size: 18px; line-height: 1.3; }
.gate-card p { margin: 0 0 var(--s3); }
.gate-card code { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
.gate-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-top: var(--s4); }

.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s2);
  padding: 0 var(--s4) var(--s3);
}
.sel { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; color: var(--muted); }
.sel select.input { width: auto; max-width: min(260px, 56vw); text-overflow: ellipsis; font-weight: 400; color: var(--text); }
.search { position: relative; flex: 1 1 220px; max-width: 360px; min-width: 0; }
.search input { width: 100%; padding-right: 30px; }
.search .kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border-strong);
  border-radius: var(--r1); padding: 0 5px; pointer-events: none; line-height: 16px;
}
.search input:focus + .kbd, .search input:not(:placeholder-shown) + .kbd { display: none; }
.toolbar-note { flex: 1 1 200px; min-width: 0; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: var(--s2); }
.toolbar-note:empty { display: none; }
.toolbar #new-btn { margin-left: auto; }

/* ---------- controls ---------- */
.input, input.input, textarea.input, select.input {
  width: 100%; min-height: 32px; padding: 5px 9px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r2);
}
textarea.input { resize: vertical; line-height: 1.45; }
.input:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.input::placeholder { color: var(--muted); opacity: 1; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 0 12px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r2); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .btn.danger.solid { color: #1a0a09; } }
.btn.danger.solid:hover:not(:disabled) { filter: brightness(0.92); background: var(--danger); }
.btn.small { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.btn.busy { color: transparent !important; pointer-events: none; }
.btn.busy::after {
  content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--muted); border-top-color: transparent; animation: spin 0.8s linear infinite;
}
.btn.primary.busy::after { border-color: var(--on-accent); border-top-color: transparent; }
.btn.icon { width: 32px; padding: 0; font-size: 20px; line-height: 1; }
kbd.hint { font: 11px var(--mono); opacity: 0.8; border: 1px solid currentColor; border-radius: var(--r1); padding: 0 4px; line-height: 15px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- shapes (markers that never rely on colour alone) ---------- */
.shape { display: inline-block; width: 10px; height: 10px; flex: none; position: relative; color: var(--k, var(--muted)); }
.s-circle { border-radius: 50%; background: currentColor; }
.s-ring { border-radius: 50%; border: 2px solid currentColor; }
.s-dring { border-radius: 50%; border: 2px dashed currentColor; }
.s-square { border-radius: 2px; background: currentColor; }
.s-diamond { background: currentColor; transform: rotate(45deg) scale(0.82); }
.s-hdiamond { border: 2px solid currentColor; transform: rotate(45deg) scale(0.82); }
.s-pulse { border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
.s-check { width: 6px; height: 10px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -2px); margin: 0 2px; }
.s-cross::before, .s-cross::after { content: ""; position: absolute; left: 4px; top: -1px; width: 2px; height: 12px; background: currentColor; border-radius: 1px; }
.s-cross::before { transform: rotate(45deg); }
.s-cross::after { transform: rotate(-45deg); }

[data-kind="did"] { --k: var(--did); --kbg: var(--did-bg); }
[data-kind="found"] { --k: var(--found); --kbg: var(--found-bg); }
[data-kind="decided"] { --k: var(--decided); --kbg: var(--decided-bg); }
[data-kind="changed"] { --k: var(--changed); --kbg: var(--changed-bg); }
[data-kind="open"] { --k: var(--open); --kbg: var(--open-bg); }
[data-kind="error"] { --k: var(--error); --kbg: var(--error-bg); }
[data-kind="working"] { --k: var(--run); --kbg: var(--run-bg); }
[data-run="running"] { --k: var(--run); --kbg: var(--run-bg); }
[data-run="idle"] { --k: var(--fin); --kbg: var(--fin-bg); }
[data-run="failed"] { --k: var(--fail); --kbg: var(--fail-bg); }
[data-run="ended"] { --k: var(--end); --kbg: var(--end-bg); }
[data-ck="task"] { --k: var(--muted); }
[data-ck="idea"] { --k: var(--idea); }
[data-ck="thread"] { --k: var(--thread); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px 1px 6px;
  border-radius: var(--r1); font-size: 12px; font-weight: 600; line-height: 18px;
  color: var(--k); background: var(--kbg); white-space: nowrap;
}
.idchip {
  display: inline-block; font: 600 12px/18px var(--mono); padding: 0 6px; border-radius: var(--r1);
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap;
}
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px 1px 6px; border-radius: var(--r1); font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; }
.tag .shape { width: 9px; height: 9px; color: inherit; }
.tag.attn { color: var(--warn); background: var(--warn-bg); box-shadow: inset 0 0 0 1px var(--warn); }
.tag.quiet { color: var(--muted); font-weight: 500; padding-left: 0; }
.ws-rep .btn { min-width: 150px; }
.ws-rep { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s2); }
.kindmark { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.kindmark .shape { width: 9px; height: 9px; }
.refchip {
  display: inline-block; font: 12px/18px var(--mono); padding: 0 6px; border-radius: var(--r1);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); overflow-wrap: anywhere;
}
.muted { color: var(--muted); }
.warn-text { color: var(--warn); }

/* ---------- board ---------- */
.board {
  flex: 1 1 0; min-height: 0; overflow-x: auto; overflow-y: hidden;
  display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); grid-template-rows: minmax(0, 1fr);
  gap: var(--s2); padding: 0 var(--s4) var(--s4);
}
.col {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--col); border: 1px solid var(--border); border-radius: var(--r3);
}
.col.over { background: var(--accent-bg); border-color: var(--accent); outline: 2px dashed var(--accent); outline-offset: -3px; }
.col-head { display: flex; align-items: center; justify-content: space-between; padding: var(--s2) var(--s3) 6px; flex: none; }
.col-head h2 { margin: 0; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.count {
  min-width: 22px; padding: 0 6px; text-align: center; font-size: 12px; line-height: 18px;
  color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r1);
}
.col-body { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 6px 8px; }
.col-empty {
  margin: 4px 2px; padding: var(--s3); text-align: center; font-size: 12.5px; color: var(--muted);
  border: 1px dashed var(--border-strong); border-radius: var(--r2);
}

.card {
  flex: none; display: flex; flex-direction: column; gap: 5px; padding: 8px 10px 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2);
  cursor: pointer; min-width: 0; text-align: left;
}
.card:hover { border-color: var(--border-strong); }
.card:focus-visible { outline-offset: -2px; }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: 0.4; }
.card.is-thread { border-left: 3px solid var(--thread); padding-left: 8px; }
.card-top { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.card-title {
  margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-note { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-from { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s2); font-size: 12px; color: var(--muted); }
.unseen { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--warn); }
.unseen .shape { color: var(--warn); width: 7px; height: 7px; }

/* ---------- banner ---------- */
.banner {
  position: fixed; z-index: 60; top: var(--s3); left: 50%; transform: translateX(-50%);
  width: min(640px, calc(100vw - 24px)); display: flex; align-items: flex-start; gap: var(--s3);
  padding: var(--s2) var(--s3); background: var(--danger-bg); color: var(--text);
  border: 1px solid var(--danger); border-radius: var(--r2);
}
.banner .banner-text { flex: 1; min-width: 0; padding-top: 4px; overflow-wrap: anywhere; }

/* ---------- drawer ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade-in 0.15s ease-out; }
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
  display: flex; flex-direction: column; background: var(--surface); color: var(--text);
  border-left: 1px solid var(--border-strong); box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
  animation: slide-in 0.18s ease-out;
}
.drawer.wide { width: min(720px, 100vw); }
.drawer:focus { outline: none; }
.dr-head { flex: none; padding: var(--s3) var(--s4) var(--s3); border-bottom: 1px solid var(--border); }
.dr-head-row { display: flex; align-items: center; gap: var(--s2); min-height: 32px; }
.dr-head-row .grow { flex: 1 1 auto; }
.dr-title { margin: var(--s2) 0 0; font-size: 17px; line-height: 1.3; font-weight: 650; overflow-wrap: anywhere; }
.dr-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s3); margin-top: var(--s2); font-size: 12.5px; color: var(--muted); }
.dr-body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.dr-foot {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2);
  padding: var(--s3) var(--s4); border-top: 1px solid var(--border); background: var(--surface);
}
.dr-foot .grow { flex: 1 1 auto; }
.foot-note { font-size: 12px; color: var(--muted); }
.confirm-text { font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .field .lbl { font-size: 12px; font-weight: 650; color: var(--muted); }
.field .err { font-size: 12px; color: var(--danger); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.meta-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--s4); margin: 0; font-size: 12.5px; padding-top: var(--s3); border-top: 1px solid var(--border); }
.meta-grid dt { color: var(--muted); }
.meta-grid dd { margin: 0; min-width: 0; }

.callout {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding: var(--s2) var(--s3);
  border-radius: var(--r2); border: 1px solid var(--border-strong); background: var(--surface-2); font-size: 13px;
}
.callout .grow { flex: 1 1 200px; min-width: 0; }
.callout.warn { background: var(--warn-bg); border-color: var(--warn); }
.callout.danger { background: var(--danger-bg); border-color: var(--danger); display: block; }
.callout.danger .callout-title { font-weight: 650; color: var(--danger); margin-bottom: 2px; }
.callout.danger .callout-body { overflow-wrap: anywhere; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }

/* ---------- thread workspace (full view) ---------- */
.ws {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text); animation: fade-in 0.15s ease-out;
}
.ws:focus { outline: none; }
.ws-bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3);
  padding: var(--s2) var(--s4); background: var(--surface); border-bottom: 1px solid var(--border-strong);
}
.ws-bar .back, .ws-bar .idchip { flex: none; }
.ws-title {
  flex: 1 1 220px; min-width: 0; margin: 0; font-size: 16px; line-height: 1.3; font-weight: 650; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

<body>
<div id="app">
  <header class="top">
    <h1>Thread board</h1>
    <span class="dir" id="dir"><span class="dir-head" id="dir-head"></span><span class="dir-tail" id="dir-tail"></span></span>
    <span class="conn" id="conn" role="status" data-state="connecting"><span class="shape s-ring"></span><span id="conn-text">Connecting</span></span>
  </header>
  <nav class="ptabs-wrap" id="ptabs-wrap" aria-label="Projects" hidden>
    <div class="ptabs" id="ptabs" role="tablist" aria-label="Projects"></div>
  </nav>
  <div class="toolbar" role="search">
    <div class="search">
      <input class="input" id="search" type="search" placeholder="Search id, title or note" aria-label="Search cards by id, title or note" autocomplete="off" spellcheck="false">
      <span class="kbd" aria-hidden="true">/</span>
    </div>
    <button type="button" class="btn" id="threads-only" aria-pressed="false">Threads only</button>
    <label class="sel" id="session-wrap" hidden><span>Session</span><select class="input" id="session-filter" aria-label="Filter threads by the session that started them"></select></label>
    <span class="toolbar-note" id="filter-note" aria-live="polite"></span>
    <button type="button" class="btn primary" id="new-btn" aria-keyshortcuts="n">New card <kbd class="hint" aria-hidden="true">N</kbd></button>
  </div>
  <div class="callout warn notice" id="notice" role="status" hidden></div>
  <main class="board" id="board" aria-label="Board columns"></main>
</div>

<div class="gate" id="gate" role="alert" hidden>
  <div class="gate-card">
    <h1>The board needs its access link</h1>
    <p>This page does not have a valid access token, so the board server turned it away. Nothing is wrong with your cards.</p>
    <p>In Claude Code, run <code>/thread:board</code> and open the link it prints.</p>
    <div class="gate-row">
      <button type="button" class="btn primary" id="gate-retry">Retry</button>
      <span class="foot-note" id="gate-msg" role="status"></span>
    </div>
  </div>
</div>

<div class="banner" id="banner" role="alert" hidden>
  <div class="banner-text" id="banner-text"></div>
  <button type="button" class="btn small" id="banner-close">Dismiss</button>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(function () {
  'use strict';

  const STATUSES = ['idea', 'new', 'in_progress', 'review', 'blocked', 'done'];
  const LABELS = { idea: 'Idea', new: 'New', in_progress: 'In progress', review: 'Review', blocked: 'Blocked', done: 'Done' };
  const EMPTY = {
    idea: 'No ideas yet. Park half-formed thoughts here.',
    new: 'Nothing waiting. New work lands here.',
    in_progress: 'Nothing in progress right now.',
    review: 'Nothing to review.',
    blocked: 'Nothing is blocked.',
    done: 'Nothing finished yet.',
  };
  const KINDS = ['did', 'found', 'decided', 'changed', 'open'];
  const KIND_LABEL = { did: 'Did', found: 'Found', decided: 'Decided', changed: 'Changed', open: 'Open' };
  const KIND_SHAPE = { did: 's-circle', found: 's-hdiamond', decided: 's-diamond', changed: 's-square', open: 's-dring' };
  const SECTIONS = [['happened', 'Happened', 'did'], ['decided', 'Decided', 'decided'], ['changed', 'Changed', 'changed'], ['open', 'Open', 'open']];
  const RUN = { running: 'Running', idle: 'Finished', failed: 'Failed', ended: 'Ended' };
  const RUN_SHAPE = { running: 's-pulse', idle: 's-check', failed: 's-cross', ended: 's-square' };
  const CK_SHAPE = { task: 's-square', idea: 's-diamond', thread: 's-ring' };
  const POLL_MS = 2000;
  const PROJECTS_MS = 5000;
  const TOKEN_KEY = 'thread-board-token';
  const READONLY_WHY = 'This project’s folder was not found, so its cards are read-only.';

  const $ = (id) => document.getElementById(id);
  const elApp = $('app'), elBoard = $('board'), elSearch = $('search'), elThreadsOnly = $('threads-only');
  const elNote = $('filter-note'), elNewBtn = $('new-btn'), elOverlay = $('overlay');
  const elBanner = $('banner'), elBannerText = $('banner-text');
  const elTabsWrap = $('ptabs-wrap'), elTabs = $('ptabs'), elNotice = $('notice');
  const elSession = $('session-filter'), elSessionWrap = $('session-wrap');
  const elGate = $('gate'), elGateRetry = $('gate-retry'), elGateMsg = $('gate-msg');

  // ---------- access token ----------
  let token = '';
  let halted = false;        // true while the access-link page is showing: no polling at all
  function readStoredToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }
  (function initToken() {
    let fromUrl = '';
    try { fromUrl = new URLSearchParams(location.search).get('t') || ''; } catch (e) { fromUrl = ''; }
    if (!fromUrl) { token = readStoredToken(); return; }
    token = fromUrl;
    try { sessionStorage.setItem(TOKEN_KEY, fromUrl); } catch (e) { /* storage unavailable: keep it in the variable */ }
    try {
      const sp = new URLSearchParams(location.search);
      sp.delete('t');
      const qs = sp.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
    } catch (e) { /* leave the address bar as it is */ }
  })();

  // ---------- projects ----------
  let projects = null;       // [{ key, projectDir, name, exists, cards, threads, running, lastActivity }] in stable tab order
  let homeKey = '';
  let selKey = '';           // the selected project
  let projectsAt = 0;
  let projectsBusy = false;
  const filterMemo = {};     // per project: { q, threadsOnly, session }

  let current = null;        // newest state from the server
  let currentKey = '';
  let lastRaw = null;
  let pollSeq = 0, appliedSeq = 0;
  let boardKey = null;
  let dragId = null, pendingRender = false, lastDragEnd = 0;
  let panel = null;          // the open drawer, if any
  let hashPushed = false;    // true when the open panel added a history entry
  let returnFocus = null;    // where focus goes when the panel closes
  let synced = false;
  const drafts = {};         // composer drafts by thread id
  const inflight = {};       // request keys currently in flight

  // ---------- small helpers ----------

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function shape(cls) { const s = h('span', 'shape ' + cls); s.setAttribute('aria-hidden', 'true'); return s; }
  function label(status) { return LABELS[status] || String(status); }
  function findCard(id) {
    if (!current) return null;
    for (const c of current.cards) if (c.id === id) return c;
    return null;
  }
  function isThread(c) { return c.kind === 'thread' && !!c.thread; }
  function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, ''); }
  function turnsOf(c) { return (c.thread && Array.isArray(c.thread.turns)) ? c.thread.turns : []; }

  function exact(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'medium' });
  }
  function rel(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return s + ' s ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' min ago';
    const hr = Math.floor(m / 60);
    if (hr < 24) return hr + ' h ago';
    const dd = Math.floor(hr / 24);
    if (dd < 14) return dd + ' d ago';
    return d.toLocaleDateString(undefined, { dateStyle: 'medium' });
  }
  function timeEl(iso) {
    const t = h('time', null, rel(iso));
    t.dateTime = iso || '';
    t.title = exact(iso);
    t.dataset.rel = iso || '';
    return t;
  }
  function fmtMs(ms) {
    let s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + 's';
    let m = Math.floor(s / 60); s = s % 60;
    if (m < 60) return m + 'm ' + String(s).padStart(2, '0') + 's';
    const hr = Math.floor(m / 60); m = m % 60;
    return hr + 'h ' + String(m).padStart(2, '0') + 'm';
  }
  function elapsedEl(iso) {
    const e = h('span', 'elapsed', fmtMs(Date.now() - new Date(iso).getTime()));
    e.dataset.since = iso;
    return e;
  }
  setInterval(() => {
    document.querySelectorAll('time[data-rel]').forEach((t) => {
      const v = rel(t.dataset.rel);
      if (t.textContent !== v) t.textContent = v;
    });
    document.querySelectorAll('[data-since]').forEach((e) => {
      const v = fmtMs(Date.now() - new Date(e.dataset.since).getTime());
      if (e.textContent !== v) e.textContent = v;
    });
  }, 1000);

  function isTyping(t) {
    if (!t || !t.tagName) return false;
    const n = t.tagName;
    return n === 'INPUT' || n === 'TEXTAREA' || n === 'SELECT' || t.isContentEditable;
  }

  // ---------- errors, connection, busy buttons ----------

  function showError(message) {
    if (halted) return;                          // the access-link page is showing instead
    elBannerText.textContent = String(message || 'Something went wrong.');
    elBanner.hidden = false;
  }
  function clearError() { elBanner.hidden = true; }
  $('banner-close').addEventListener('click', () => {
    clearError();
    if (panel && panel.drawer) panel.drawer.focus({ preventScroll: true });
  });

  function setOnline(ok) {
    const state = ok ? 'online' : 'offline';
    const el = $('conn');
    if (el.dataset.state === state) return;
    el.dataset.state = state;
    $('conn-text').textContent = ok ? 'Online' : 'Offline';
    el.querySelector('.shape').className = 'shape ' + (ok ? 's-circle' : 's-cross');
  }

  function syncBusy() {
    document.querySelectorAll('[data-busykey]').forEach((b) => {
      const busy = !!inflight[b.dataset.busykey];
      b.classList.toggle('busy', busy);
      if (busy) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
      b.disabled = busy || b.dataset.off === '1';
    });
  }
  async function runAction(key, fn) {
    if (inflight[key]) return undefined;
    inflight[key] = true;
    syncBusy();
    try { return await fn(); }
    finally { delete inflight[key]; syncBusy(); }
  }
  // A button tied to a request key: busy while in flight, never double-submitted.
  function actionBtn(text, cls, key, onClick) {
    const b = h('button', 'btn' + (cls ? ' ' + cls : ''), text);
    b.type = 'button';
    b.dataset.busykey = key;
    b.addEventListener('click', () => { if (!inflight[key] && b.dataset.off !== '1') onClick(b); });
    return b;
  }
  function setOff(b, off) { b.dataset.off = off ? '1' : '0'; b.disabled = off || !!inflight[b.dataset.busykey]; }
  function plainBtn(text, cls, onClick) {
    const b = h('button', 'btn' + (cls ? ' ' + cls : ''), text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }

  // ---------- network ----------

  function authError() { const e = new Error('The board needs its access link.'); e.auth = true; return e; }

  // One place that talks to the server: always sends the token, turns 401 into the access-link page.
  async function request(method, path, body, timeoutMs) {
    if (!token) { haltForAuth(); throw authError(); }
    const opts = { method, headers: { 'X-Thread-Token': token }, cache: 'no-store' };
    if (method !== 'GET') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body || {}); }
    if (timeoutMs && typeof AbortSignal !== 'undefined' && AbortSignal.timeout) opts.signal = AbortSignal.timeout(timeoutMs);
    let res, text;
    try { res = await fetch(path, opts); text = await res.text(); }
    catch (e) { throw new Error('Could not reach the board server.'); }
    if (res.status === 401) { haltForAuth(); throw authError(); }
    return { res, text };
  }
  function parseJson(text) { try { return JSON.parse(text); } catch (e) { return null; } }
  async function api(method, path, body) {
    const { res, text } = await request(method, path, body);
    const data = parseJson(text);
    if (!res.ok) throw new Error((data && data.error) ? data.error : 'Request failed (status ' + res.status + ')');
    return data;
  }
  function pp(key, rest) { return '/api/p/' + encodeURIComponent(key) + '/' + rest; }

  // ----- access-link page -----
  let loopTimer = null;
  function haltForAuth() {
    if (halted) return;
    halted = true;
    clearTimeout(loopTimer); loopTimer = null;
    if (panel) { if (panel.dispose) panel.dispose(); panel = null; }
    elOverlay.replaceChildren();
    elOverlay.hidden = true;
    elApp.inert = false;
    elBanner.hidden = true;
    elApp.hidden = true;
    elGate.hidden = false;
    elGateRetry.focus({ preventScroll: true });
  }
  function resumeAfterAuth() {
    halted = false;
    elGate.hidden = true;
    elApp.hidden = false;
    elGateMsg.textContent = '';
    if (selKey) { const k = selKey; selKey = ''; selectProject(k); }
    else syncFromHash();
    loopTimer = setTimeout(tick, POLL_MS);
  }
  elGateRetry.addEventListener('click', async () => {
    if (elGateRetry.classList.contains('busy')) return;
    elGateRetry.classList.add('busy'); elGateRetry.disabled = true;
    elGateMsg.textContent = '';
    token = readStoredToken();
    try {
      if (!token) elGateMsg.textContent = 'No access link is stored in this tab. Open the link that /thread:board prints.';
      else { applyProjects(await loadProjects()); resumeAfterAuth(); }
    } catch (e) {
      elGateMsg.textContent = e.auth ? 'That access link is not valid (any more). Run /thread:board again and open the new link.' : e.message;
    } finally {
      elGateRetry.classList.remove('busy'); elGateRetry.disabled = false;
    }
  });

  // ----- loops -----
  async function tick() {
    loopTimer = null;
    if (halted) return;
    await poll();
    if (halted) return;
    if (!projects || Date.now() - projectsAt >= PROJECTS_MS) await refreshProjects();
    if (halted) return;
    loopTimer = setTimeout(tick, POLL_MS);
  }

  async function poll() {
    if (halted || !selKey) return;
    const key = selKey;
    const seq = ++pollSeq;
    let res, text;
    try { ({ res, text } = await request('GET', pp(key, 'state'), null, 5000)); }
    catch (e) {
      if (!e.auth && key === selKey && seq > appliedSeq) setOnline(false);
      return;
    }
    if (key !== selKey) return;                 // the user moved to another project meanwhile
    if (!res.ok) {
      if (res.status === 404) refreshProjects(); // the project vanished: the list will move us on
      else if (seq > appliedSeq) setOnline(false);
      return;
    }
    if (seq < appliedSeq) return;
    appliedSeq = seq;
    setOnline(true);
    if (text === lastRaw) return;               // nothing changed: no DOM work
    const data = parseJson(text);
    if (!data || !Array.isArray(data.cards)) return;
    lastRaw = text;
    try { apply(data); } catch (e) { console.error(e); }
  }

  // Use a card the server just returned without waiting for the next poll.
  function applyCard(card, key) {
    if (!current || !card || (key !== undefined && key !== selKey)) return;
    const cards = current.cards.slice();
    const i = cards.findIndex((c) => c.id === card.id);
    if (i >= 0) cards[i] = card; else cards.push(card);
    appliedSeq = ++pollSeq;                     // older polls still in flight are ignored
    lastRaw = null;
    apply(Object.assign({}, current, { cards }));
  }

  function apply(data) {
    current = data;
    currentKey = JSON.stringify(data);
    setDir(data.projectDir ? String(data.projectDir) : '');
    updateToolbar();
    renderNotice();
    renderBoard(false);
    if (!synced) { synced = true; syncFromHash(); }
    else updatePanel();
  }

  // ---------- projects and tabs ----------

  function projectByKey(key) {
    if (!projects || !key) return null;
    for (const p of projects) if (p.key === key) return p;
    return null;
  }
  function isRO() {
    if (current && typeof current.exists === 'boolean') return !current.exists;
    const p = projectByKey(selKey);
    return !!(p && p.exists === false);
  }
  function parentName(dir) {
    const parts = String(dir || '').split(/[\\/]+/).filter(Boolean);
    return parts.length >= 2 ? parts[parts.length - 2] : '';
  }

  async function loadProjects() {
    const { res, text } = await request('GET', '/api/projects', null, 5000);
    const data = parseJson(text);
    if (!res.ok || !data || !Array.isArray(data.projects)) throw new Error((data && data.error) ? data.error : 'Request failed (status ' + res.status + ')');
    return data;
  }
  let projectsAgain = false;
  async function refreshProjects() {
    if (halted) return;
    if (projectsBusy) { projectsAgain = true; return; }
    projectsBusy = true;
    try { applyProjects(await loadProjects()); }
    catch (e) { /* 401 shows the access-link page; a network failure is shown by the state poll */ }
    finally {
      projectsBusy = false;
      projectsAt = Date.now();
      if (projectsAgain) { projectsAgain = false; refreshProjects(); }
    }
  }
  // a write went through: counts and activity in the tabs have changed
  function wrote() { refreshProjects(); }

  function applyProjects(data) {
    const incoming = data.projects.filter((p) => p && typeof p.key === 'string');
    const byKey = {};
    incoming.forEach((p) => { byKey[p.key] = p; });
    // keep the tabs where they are; the server sorts by activity, which would shuffle them under the pointer
    const order = [];
    if (projects) projects.forEach((p) => { if (byKey[p.key]) order.push(p.key); });
    incoming.forEach((p) => { if (!order.includes(p.key)) order.push(p.key); });
    const first = projects === null;
    projects = order.map((k) => byKey[k]);
    homeKey = (typeof data.home === 'string' && byKey[data.home]) ? data.home : (projects.length ? projects[0].key : '');
    maybeRenderTabs();
    if (first) { syncFromHash(); return; }
    if (selKey && !byKey[selKey]) {
      history.replaceState(null, '', location.pathname + location.search + hashFor(homeKey, ''));
      syncFromHash();
      return;
    }
    updateToolbar();
    renderNotice();
  }

  let tabsSig = '';
  function tabSig() {
    return JSON.stringify([selKey, (projects || []).map((p) => [p.key, p.name, p.projectDir, p.exists, p.cards, p.running])]);
  }
  function maybeRenderTabs() { if (tabSig() !== tabsSig) renderTabs(false); }
  function renderTabs(reveal) {
    tabsSig = tabSig();
    const list = projects || [];
    elTabsWrap.hidden = !list.length;
    const a = document.activeElement;
    const focusKey = (a && a.classList && a.classList.contains('ptab') && elTabs.contains(a)) ? a.dataset.key : null;
    const scroll = elTabs.scrollLeft;
    const nameCount = {};
    list.forEach((p) => { nameCount[p.name] = (nameCount[p.name] || 0) + 1; });
    const frag = document.createDocumentFragment();
    let selBtn = null, focusBtn = null;
    list.forEach((p) => {
      const missing = p.exists === false;
      const sel = p.key === selKey;
      const b = h('button', 'ptab');
      b.type = 'button';
      b.id = 'ptab-' + p.key;
      b.dataset.key = p.key;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', sel ? 'true' : 'false');
      b.tabIndex = sel ? 0 : -1;
      if (missing) b.dataset.missing = '1';
      b.title = p.projectDir + (missing ? ' (folder missing)' : '');
      const parent = nameCount[p.name] > 1 ? parentName(p.projectDir) : '';
      b.appendChild(h('span', 'pt-name', p.name + (parent ? ' (' + parent + ')' : '')));
      const n = h('span', 'count tnum', String(p.cards));
      n.setAttribute('aria-hidden', 'true');
      b.appendChild(n);
      b.appendChild(h('span', 'sr-only', ', ' + p.cards + (p.cards === 1 ? ' card' : ' cards')));
      if (p.running > 0) {
        const d = shape('s-pulse');
        d.dataset.run = 'running';
        b.appendChild(d);
        b.appendChild(h('span', 'sr-only', ', ' + p.running + ' running'));
      }
      if (missing) b.appendChild(h('span', 'pt-miss', 'folder missing'));
      frag.appendChild(b);
      if (sel) selBtn = b;
      if (p.key === focusKey) focusBtn = b;
    });
    elTabs.replaceChildren(frag);
    elTabs.scrollLeft = scroll;
    if (reveal && selBtn) {
      const l = selBtn.offsetLeft, w = selBtn.offsetWidth;
      if (l < elTabs.scrollLeft) elTabs.scrollLeft = Math.max(0, l - 8);
      else if (l + w > elTabs.scrollLeft + elTabs.clientWidth) elTabs.scrollLeft = l + w - elTabs.clientWidth + 8;
    }
    if (reveal && focusKey && selBtn) focusBtn = selBtn;   // the selection moved (Back/Forward): focus follows it
    if (focusBtn) focusBtn.focus({ preventScroll: true });
  }

  function goProject(key) {
    if (!key || key === selKey) return;
    location.hash = hashFor(key, '');
    syncFromHash();                              // do not wait for the hashchange event: focus stays on the tab
  }
  elTabs.addEventListener('click', (e) => {
    const t = e.target.closest ? e.target.closest('.ptab') : null;
    if (t) goProject(t.dataset.key);
  });
  elTabs.addEventListener('keydown', (e) => {
    const t = e.target.closest ? e.target.closest('.ptab') : null;
    if (!t || !projects || e.altKey || e.ctrlKey || e.metaKey) return;
    const i = projects.findIndex((p) => p.key === t.dataset.key);
    let n = -1;
    if (e.key === 'ArrowRight') n = (i + 1) % projects.length;
    else if (e.key === 'ArrowLeft') n = (i + projects.length - 1) % projects.length;
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End') n = projects.length - 1;
    if (n < 0) return;
    e.preventDefault();
    goProject(projects[n].key);
    const nb = elTabs.querySelector('.ptab[data-key="' + cssEscape(projects[n].key) + '"]');
    if (nb) { nb.focus({ preventScroll: true }); nb.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }
  });

  // Switch to a project: forget the old state, show the new tab, fetch the new board.
  function selectProject(key) {
    saveFilters();
    selKey = key;
    current = null; currentKey = ''; lastRaw = null; boardKey = null; synced = false; pendingRender = false;
    loadFilters();
    const p = projectByKey(key);
    setDir(p ? p.projectDir : '');
    renderTabs(true);
    elBoard.replaceChildren();
    elNote.replaceChildren();
    updateSessionOptions();
    updateToolbar();
    renderNotice();
    poll();
  }

  function saveFilters() {
    if (!selKey) return;
    filterMemo[selKey] = { q: elSearch.value, threadsOnly: elThreadsOnly.getAttribute('aria-pressed') === 'true', session: sessionSel };
  }
  function loadFilters() {
    const m = filterMemo[selKey] || { q: '', threadsOnly: false, session: '' };
    elSearch.value = m.q;
    elThreadsOnly.setAttribute('aria-pressed', m.threadsOnly ? 'true' : 'false');
    sessionSel = m.session;
  }

  // The toolbar's New card button follows the selected project's state.
  function updateToolbar() {
    const ro = !!selKey && isRO();
    elNewBtn.setAttribute('aria-disabled', ro ? 'true' : 'false');
    elNewBtn.title = ro ? READONLY_WHY : '';
  }

  // The bar above the columns for a project whose folder is gone.
  let noticeSig = '';
  let forgetAsk = '';          // project key whose forget confirm step is showing
  function renderNotice() {
    const ro = !!selKey && isRO();
    if (!ro) { noticeSig = ''; forgetAsk = ''; elNotice.hidden = true; elNotice.replaceChildren(); return; }
    const p = projectByKey(selKey);
    const dir = (current && current.projectDir) || (p && p.projectDir) || '';
    const key = selKey;
    const sig = key + '|' + dir + '|' + (forgetAsk === key);
    if (sig === noticeSig) return;
    noticeSig = sig;
    const hadFocus = elNotice.contains(document.activeElement);
    elNotice.replaceChildren();
    elNotice.hidden = false;
    if (forgetAsk === key) {
      elNotice.appendChild(h('span', 'confirm-text', 'Forget this project? Its stored cards are removed from the board and this cannot be undone.'));
      const keep = plainBtn('Keep it', 'small', () => { forgetAsk = ''; renderNotice(); });
      elNotice.append(keep, actionBtn('Forget project', 'small danger solid', 'forget:' + key, () => forgetProject(key)));
      if (hadFocus) keep.focus();
    } else {
      const grow = h('span', 'grow');
      grow.append('This project’s folder was not found at ');
      grow.appendChild(h('code', null, dir));
      grow.append('. Its cards are shown read-only.');
      elNotice.appendChild(grow);
      const ask = plainBtn('Forget this project', 'small', () => { forgetAsk = key; renderNotice(); });
      elNotice.appendChild(ask);
      if (hadFocus) ask.focus();
    }
    syncBusy();
  }
  async function forgetProject(key) {
    clearError();
    let ok = false;
    await runAction('forget:' + key, async () => {
      try { await api('DELETE', '/api/p/' + encodeURIComponent(key), {}); ok = true; }
      catch (e) { showError(e.message); forgetAsk = ''; noticeSig = ''; }
    });
    if (ok) {
      forgetAsk = '';
      delete filterMemo[key];
      await refreshProjects();
      if (selKey === key) {
        history.replaceState(null, '', location.pathname + location.search + hashFor(homeKey, ''));
        syncFromHash();
      }
    } else if (selKey === key) renderNotice();
  }

  // ---------- parent sessions ----------
  let sessionSel = '';       // selected parent session id in the Session filter ('' = all)
  function sessionInfo(id) {
    return (current && current.sessions && id && current.sessions[id] && typeof current.sessions[id] === 'object') ? current.sessions[id] : null;
  }
  function sessionLabel(id) {
    const s = sessionInfo(id);
    if (s && s.label) return String(s.label);
    return id ? 'session ' + String(id).slice(0, 8) : '';
  }
  let sessSig = '';
  function updateSessionOptions() {
    const map = {};
    if (current) current.cards.forEach((c) => { if (isThread(c) && c.thread.parentSessionId) map[c.thread.parentSessionId] = sessionLabel(c.thread.parentSessionId); });
    if (sessionSel && !map[sessionSel] && current) sessionSel = '';
    const ids = Object.keys(map).sort((a, b) => map[a].localeCompare(map[b]));
    const sig = JSON.stringify([ids.map((i) => [i, map[i]]), sessionSel]);
    if (sig === sessSig) return;
    sessSig = sig;
    elSessionWrap.hidden = !ids.length;
    const frag = document.createDocumentFragment();
    const all = h('option', null, 'All sessions'); all.value = ''; frag.appendChild(all);
    ids.forEach((i) => { const o = h('option', null, map[i]); o.value = i; o.title = map[i]; frag.appendChild(o); });
    elSession.replaceChildren(frag);
    elSession.value = sessionSel;
  }
  elSession.addEventListener('change', () => { sessionSel = elSession.value; renderBoard(false); });

  let dirShown = null;
  function setDir(dir) {
    if (dir === dirShown) return;
    dirShown = dir;
    const cut = Math.max(dir.lastIndexOf('/'), dir.lastIndexOf('\\'));
    $('dir-head').textContent = cut > 0 ? dir.slice(0, cut) : '';
    $('dir-tail').textContent = cut > 0 ? dir.slice(cut) : dir;
    $('dir').title = dir;
  }

  // ---------- board ----------

  function filterState() {
    return { q: elSearch.value.trim().toLowerCase(), threadsOnly: elThreadsOnly.getAttribute('aria-pressed') === 'true', session: sessionSel };
  }
  function matches(c, f) {
    if (f.session && !(isThread(c) && c.thread.parentSessionId === f.session)) return false;
    if (f.threadsOnly && !isThread(c)) return false;
    if (!f.q) return true;
    return (c.id + ' ' + c.title + ' ' + (c.note || '')).toLowerCase().includes(f.q);
  }

  function renderBoard(force) {
    if (!current) return;
    if (dragId !== null) { pendingRender = true; return; }
    updateSessionOptions();
    const f = filterState();
    const key = currentKey + '|' + f.q + '|' + f.threadsOnly + '|' + f.session;
    if (!force && key === boardKey) return;
    boardKey = key;
    pendingRender = false;

    const scrollLeft = elBoard.scrollLeft;
    const colScroll = {};
    elBoard.querySelectorAll('.col').forEach((c) => { colScroll[c.dataset.status] = c.querySelector('.col-body').scrollTop; });
    const a = document.activeElement;
    const focusId = (a && a.classList && a.classList.contains('card') && elBoard.contains(a)) ? a.dataset.id : null;

    const filtering = !!(f.q || f.threadsOnly || f.session);
    const shown = current.cards.filter((c) => matches(c, f));
    const byStatus = {};
    STATUSES.forEach((s) => { byStatus[s] = []; });
    shown.forEach((c) => { if (byStatus[c.status]) byStatus[c.status].push(c); });

    const frag = document.createDocumentFragment();
    STATUSES.forEach((s) => frag.appendChild(buildColumn(s, byStatus[s], filtering, f.session)));
    elBoard.replaceChildren(frag);
    elBoard.scrollLeft = scrollLeft;
    elBoard.querySelectorAll('.col').forEach((c) => {
      if (colScroll[c.dataset.status]) c.querySelector('.col-body').scrollTop = colScroll[c.dataset.status];
    });
    if (focusId) {
      const t = elBoard.querySelector('.card[data-id="' + cssEscape(focusId) + '"]');
      if (t) t.focus({ preventScroll: true });
    }

    // the line beside the toolbar
    elNote.replaceChildren();
    if (!current.cards.length) {
      elNote.textContent = 'The board is empty. Press N to add the first card.';
    } else if (filtering) {
      const total = current.cards.length;
      if (!shown.length) {
        let what;
        if (f.session) what = f.q ? 'No threads from ' + sessionLabel(f.session) + ' match “' + elSearch.value.trim() + '”.' : 'No threads from ' + sessionLabel(f.session) + ' on this board. Tasks and ideas are hidden while a session is selected.';
        else what = f.q ? 'No cards match “' + elSearch.value.trim() + '”' + (f.threadsOnly ? ' among threads.' : '.') : 'No threads on the board yet.';
        elNote.appendChild(h('span', null, what));
      } else {
        elNote.appendChild(h('span', 'tnum', 'Showing ' + shown.length + ' of ' + total + ' cards.' + (f.session ? ' Tasks and ideas are hidden while a session is selected.' : '')));
      }
      const clear = plainBtn('Clear filters', 'small', () => {
        elSearch.value = '';
        elThreadsOnly.setAttribute('aria-pressed', 'false');
        sessionSel = '';
        renderBoard(true);
        elSearch.focus();
      });
      elNote.appendChild(clear);
    }
  }

  function buildColumn(status, cards, filtering, session) {
    const col = h('section', 'col');
    col.dataset.status = status;
    col.setAttribute('aria-label', label(status) + ', ' + cards.length + (cards.length === 1 ? ' card' : ' cards'));

    const head = h('div', 'col-head');
    head.appendChild(h('h2', null, label(status)));
    head.appendChild(h('span', 'count', String(cards.length)));
    col.appendChild(head);

    const body = h('div', 'col-body');
    if (!cards.length) body.appendChild(h('div', 'col-empty', session ? 'No threads from this session here.' : filtering ? 'No matching cards in this column.' : EMPTY[status]));
    cards.forEach((c) => body.appendChild(buildCard(c)));
    col.appendChild(body);

    col.addEventListener('dragenter', (e) => { if (dragId === null) return; e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragover', (e) => {
      if (dragId === null) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', (e) => {
      if (dragId === null) return;
      e.preventDefault();
      const id = dragId;
      endDrag();
      moveCard(id, status);
    });
    return col;
  }

  function buildCard(card) {
    const thread = isThread(card);
    const t = thread ? card.thread : null;
    const el = h('article', 'card' + (thread ? ' is-thread' : ''));
    el.dataset.id = card.id;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');

    const top = h('div', 'card-top');
    top.appendChild(h('span', 'idchip', card.id));
    const kind = thread ? 'thread' : String(card.kind);
    const km = h('span', 'kindmark');
    km.dataset.ck = kind;
    km.appendChild(shape(CK_SHAPE[kind] || 's-square'));
    km.appendChild(h('span', null, kind));
    top.appendChild(km);
    el.appendChild(top);

    el.appendChild(h('h3', 'card-title', card.title));
    if (card.note) el.appendChild(h('p', 'card-note', card.note));
    if (thread && t.parentSessionId) {
      const from = h('p', 'card-from', 'from ' + sessionLabel(t.parentSessionId));
      from.title = sessionLabel(t.parentSessionId);
      el.appendChild(from);
    }

    const foot = h('div', 'card-foot');
    if (thread) {
      foot.appendChild(runPill(t.runState));
      const n = turnsOf(card).length;
      foot.appendChild(h('span', 'tnum', n + (n === 1 ? ' turn' : ' turns')));
      const rt = reportTag(card);
      if (rt) foot.appendChild(rt);
    }
    if (card.seenByClaude === false) {
      const u = h('span', 'unseen');
      u.appendChild(shape('s-circle'));
      u.appendChild(h('span', null, 'Claude has not seen this yet'));
      foot.appendChild(u);
    }
    if (foot.childNodes.length) el.appendChild(foot);

    const rs = thread ? reportState(card) : '';
    el.setAttribute('aria-label', card.id + ', ' + kind + ', ' + card.title + (thread ? ', ' + (RUN[t.runState] || t.runState).toLowerCase() : '') + (thread && t.parentSessionId ? ', from ' + sessionLabel(t.parentSessionId) : '') + (rs === 'not' ? ', not reported' : rs === 'yes' ? ', reported' : '') + (card.seenByClaude === false ? ', Claude has not seen this yet' : ''));

    el.addEventListener('click', () => {
      if (Date.now() - lastDragEnd < 200) return;
      openCard(card.id, el);
    });
    el.addEventListener('keydown', (e) => {
      if (e.target !== el) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(card.id, el); }
    });

    if (!thread && !isRO()) {
      el.draggable = true;
      el.addEventListener('dragstart', (e) => {
        dragId = card.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', card.id);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', endDrag);
    }
    return el;
  }

  // 'not' = a successful result the main session has not pulled, 'yes' = the newest result was pulled, '' = no result yet
  function reportState(card) {
    const t = card.thread;
    if (!t || t.lastResult === null || t.lastResult === undefined) return '';
    return t.reported ? 'yes' : 'not';
  }
  function reportTag(card) {
    const st = reportState(card);
    if (!st) return null;
    const tag = h('span', 'tag ' + (st === 'not' ? 'attn' : 'quiet'));
    tag.appendChild(shape(st === 'not' ? 's-diamond' : 's-ring'));
    tag.appendChild(h('span', null, st === 'not' ? 'Not reported' : 'Reported'));
    tag.title = st === 'not' ? 'The main session has not pulled this thread’s result yet' : 'The main session has pulled this thread’s newest result';
    return tag;
  }

  function runPill(state) {
    const p = h('span', 'pill');
    p.dataset.run = state;
    p.appendChild(shape(RUN_SHAPE[state] || 's-circle'));
    p.appendChild(h('span', null, (RUN[state] || String(state))));
    return p;
  }

  function endDrag() {
    const was = dragId !== null;
    dragId = null;
    if (was) lastDragEnd = Date.now();
    document.querySelectorAll('.col.over').forEach((c) => c.classList.remove('over'));
    document.querySelectorAll('.card.dragging').forEach((c) => c.classList.remove('dragging'));
    if (was && pendingRender) renderBoard(false);
  }
  document.addEventListener('dragend', endDrag);

  async function moveCard(id, status) {
    const card = findCard(id);
    if (!card || isThread(card) || card.status === status || isRO()) return;
    const key = selKey;
    clearError();
    await runAction('move:' + key + ':' + id, async () => {
      try { applyCard(await api('PATCH', pp(key, 'cards/' + encodeURIComponent(id)), { status }), key); wrote(); }
      catch (e) { showError(e.message); }
    });
    poll();
  }

  elSearch.addEventListener('input', () => renderBoard(false));
  elThreadsOnly.addEventListener('click', () => {
    elThreadsOnly.setAttribute('aria-pressed', elThreadsOnly.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    renderBoard(false);
  });
  elNewBtn.addEventListener('click', () => { if (elNewBtn.getAttribute('aria-disabled') === 'true') return; openNew(); });
  elSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && elSearch.value) { e.stopPropagation(); elSearch.value = ''; renderBoard(false); }
  });

  // ---------- markdown subset (DOM nodes only) ----------

  const BULLET_RE = /^(\s*)(?:[-*+•])\s+(.*)$/;
  const NUM_RE = /^(\s*)\d+[.)]\s+(.*)$/;
  const NONE_RE = /^(none|nothing|nil|n\/a|no changes?|no open (?:items?|questions?|issues?)|no decisions?)(?!\s+of\b)\b.{0,48}$/i;

  function inline(parent, text) {
    const re = /(`+)([^`]+?)\1|\*\*([^*]+?)\*\*|__([^_]+?)__/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[2] !== undefined) parent.appendChild(h('code', null, m[2]));
      else parent.appendChild(h('strong', null, m[3] !== undefined ? m[3] : m[4]));
      last = re.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function inlineEl(tag, cls, text) { const e = h(tag, cls); inline(e, text); return e; }

  function renderMarkdown(src) {
    const root = h('div', 'md');
    const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    let i = 0, para = [];
    const flush = () => { if (para.length) { root.appendChild(inlineEl('p', null, para.join(' '))); para = []; } };
    while (i < lines.length) {
      const line = lines[i];
      let m = /^\s*(```+|~~~+)/.exec(line);
      if (m) {
        flush();
        const fence = m[1][0];
        const buf = [];
        i++;
        while (i < lines.length && !new RegExp('^\\s*' + (fence === '`' ? '```' : '~~~')).test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        const pre = h('pre');
        pre.tabIndex = 0;
        pre.appendChild(h('code', null, buf.join('\n')));
        root.appendChild(pre);
        continue;
      }
      if (/^\s*$/.test(line)) { flush(); i++; continue; }
      m = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
      if (m) { flush(); root.appendChild(inlineEl('h4', m[1].length <= 2 ? 'l1' : '', m[2])); i++; continue; }
      if (BULLET_RE.test(line) || NUM_RE.test(line)) {
        flush();
        const ordered = !BULLET_RE.test(line);
        const baseIndent = (BULLET_RE.exec(line) || NUM_RE.exec(line))[1].length;
        const list = h(ordered ? 'ol' : 'ul');
        let lastLi = null, nested = null;
        while (i < lines.length) {
          const l = lines[i];
          const bm = BULLET_RE.exec(l), nm = NUM_RE.exec(l);
          const mm = bm || nm;
          if (mm) {
            const indent = mm[1].length;
            if (indent >= baseIndent + 2 && lastLi) {
              if (!nested) { nested = h(bm ? 'ul' : 'ol'); lastLi.appendChild(nested); }
              nested.appendChild(inlineEl('li', null, mm[2]));
            } else {
              nested = null;
              lastLi = inlineEl('li', null, mm[2]);
              list.appendChild(lastLi);
            }
            i++;
          } else if (/^\s+\S/.test(l) && lastLi) {
            lastLi.appendChild(document.createTextNode(' ' + l.trim()));
            i++;
          } else break;
        }
        root.appendChild(list);
        continue;
      }
      para.push(line.trim());
      i++;
    }
    flush();
    return root;
  }

  // Digest text -> clean items; none-like lines are dropped.
  function isNone(s) {
    const t = String(s).replace(/[*_`]/g, '').trim().replace(/[.;:!\s]+$/, '');
    return !t || NONE_RE.test(t);
  }
  function itemsOf(text) {
    const out = [];
    String(text || '').replace(/\r\n?/g, '\n').split('\n').forEach((raw) => {
      if (!raw.trim() || /^\s*#{1,6}\s/.test(raw)) return;
      const m = BULLET_RE.exec(raw) || NUM_RE.exec(raw);
      if (m) out.push(m[2].trim());
      else if (out.length && /^\s+/.test(raw)) out[out.length - 1] += ' ' + raw.trim();
      else out.push(raw.trim());
    });
    return out.filter((s) => !isNone(s));
  }

  // Fallback if the server did not attach a view.
  function viewOf(turn) {
    if (turn.view && typeof turn.view === 'object') return turn.view;
    if (typeof turn.result !== 'string') return null;
    const out = { body: '', sections: { happened: '', decided: '', changed: '', open: '' }, map: [] };
    const re = /^##\s+(Happened|Decided|Changed|Open)\s*$/gim;
    const marks = [];
    let m;
    while ((m = re.exec(turn.result)) !== null) marks.push({ k: m[1].toLowerCase(), s: m.index, e: re.lastIndex });
    if (!marks.length) { out.body = turn.result.trim(); return out; }
    out.body = turn.result.slice(0, marks[0].s).trim();
    marks.forEach((mk, i) => { out.sections[mk.k] = turn.result.slice(mk.e, i + 1 < marks.length ? marks[i + 1].s : undefined).trim(); });
    return out;
  }

  // ---------- trace model ----------

  function turnState(card, i) {
    const t = turnsOf(card)[i];
    if (t.ok === false) return 'failed';
    if (t.ok === true) return 'ok';
    if (!t.finishedAt && card.thread.runState === 'running' && i === turnsOf(card).length - 1) return 'running';
    return 'pending';
  }
  function stepsOf(turn) {
    const v = viewOf(turn);
    if (!v) return [];
    if (Array.isArray(v.map) && v.map.length) return v.map.map((s) => ({ kind: KINDS.includes(s.kind) ? s.kind : 'did', text: String(s.text || ''), ref: s.ref }));
    const out = [];
    SECTIONS.forEach(([key, , kind]) => itemsOf(v.sections && v.sections[key]).forEach((text) => out.push({ kind, text })));
    return out;
  }
  function firstLine(s) { return String(s || '').split('\n').map((x) => x.trim()).find(Boolean) || ''; }

  // ---------- panel plumbing ----------

  function decode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
  // '#/<project>' or '#/<project>/<card>'; the old '#<card>' form has no project part
  function parseHash() {
    const raw = (location.hash || '').replace(/^#/, '');
    if (raw.startsWith('/')) {
      const rest = raw.slice(1);
      const cut = rest.indexOf('/');
      return { key: decode(cut < 0 ? rest : rest.slice(0, cut)), target: cut < 0 ? '' : decode(rest.slice(cut + 1)) };
    }
    return { key: '', target: decode(raw) };
  }
  function hashFor(key, target) { return '#/' + encodeURIComponent(key) + (target ? '/' + encodeURIComponent(target) : ''); }

  function openCard(id, fromEl) {
    returnFocus = fromEl ? { id } : null;
    navigateOpen(id);
  }
  function openNew() { if (halted || isRO()) return; returnFocus = { el: elNewBtn }; navigateOpen('new'); }
  function navigateOpen(target) {
    if (panel) return;
    hashPushed = true;
    location.hash = hashFor(selKey, target);
  }

  window.addEventListener('hashchange', syncFromHash);

  function syncFromHash() {
    if (halted || !projects) return;
    const hs = parseHash();
    // no project in the hash: stay on the selected one (home at first); an unknown project: home
    const wanted = hs.key ? (projectByKey(hs.key) ? hs.key : homeKey) : (selKey || homeKey);
    if (!wanted) { elBoard.replaceChildren(); return; }
    if (wanted !== selKey) {
      if (panel && panel.isDirty && panel.isDirty()) {
        // leaving with unsaved edits: put the hash back and ask first
        history.pushState(null, '', hashFor(selKey, panel.target));
        panel.showDiscard();
        return;
      }
      if (panel) removePanel(false);
      selectProject(wanted);
    }
    if (hs.key !== wanted) history.replaceState(null, '', location.pathname + location.search + hashFor(wanted, hs.target));
    if (!current) return;                        // the board is still loading; apply() comes back here
    const target = hs.target;
    if (target === 'new' && isRO()) {
      history.replaceState(null, '', location.pathname + location.search + hashFor(selKey, ''));
      if (panel) removePanel(false);
      return;
    }
    if (panel && panel.target === target) { updatePanel(); return; }
    if (panel && panel.isDirty && panel.isDirty()) {
      history.pushState(null, '', hashFor(selKey, panel.target));
      panel.showDiscard();
      return;
    }
    if (panel) removePanel(!!target);
    if (target) buildPanel(target);
  }

  function requestClose() {
    if (!panel) return;
    if (panel.isDirty && panel.isDirty()) { panel.showDiscard(); return; }
    navigateClose();
  }
  function navigateClose() {
    if (hashPushed) { hashPushed = false; history.back(); }
    else {
      history.replaceState(null, '', location.pathname + location.search + hashFor(selKey, ''));
      syncFromHash();
    }
  }

  function removePanel(swapping) {
    if (!panel) return;
    if (panel.dispose) panel.dispose();
    panel = null;
    elOverlay.replaceChildren();
    if (swapping) return;      // another panel is about to replace this one
    elOverlay.hidden = true;
    elApp.inert = false;
    const rf = returnFocus;
    returnFocus = null;
    hashPushed = false;
    let target = null;
    if (rf && rf.id) target = elBoard.querySelector('.card[data-id="' + cssEscape(rf.id) + '"]');
    else if (rf && rf.el) target = rf.el;
    (target || elNewBtn).focus({ preventScroll: true });
  }

  function mountDrawer(P, wide) {
    const scrim = h('div', 'scrim');
    scrim.addEventListener('click', requestClose);
    const drawer = h('aside', 'drawer' + (wide ? ' wide' : ''));
    drawer.setAttribute('role', 'dialog');
    drawer.setAttribute('aria-modal', 'true');
    drawer.setAttribute('aria-labelledby', 'drawer-title');
    drawer.tabIndex = -1;
    P.drawer = drawer;
    elOverlay.replaceChildren(scrim, drawer);
    elOverlay.hidden = false;
    elApp.inert = true;
  }

  function headRow(P, card, createMode) {
    const row = h('div', 'dr-head-row');
    if (createMode) row.appendChild(h('span', 'muted', 'Draft'));
    else {
      row.appendChild(h('span', 'idchip', card.id));
      const kind = isThread(card) ? 'thread' : card.kind;
      const km = h('span', 'kindmark');
      km.dataset.ck = kind;
      km.appendChild(shape(CK_SHAPE[kind] || 's-square'));
      km.appendChild(h('span', null, kind));
      row.appendChild(km);
    }
    row.appendChild(h('span', 'grow'));
    const x = plainBtn('×', 'icon ghost', requestClose);
    x.setAttribute('aria-label', 'Close panel');
    x.title = 'Close (Esc)';
    row.appendChild(x);
    return row;
  }

  function buildPanel(target) {
    if (target === 'new') { buildTaskPanel(null); }
    else {
      const card = findCard(target);
      if (!card) buildMissing(target);
      else if (isThread(card)) buildThreadPanel(card);
      else buildTaskPanel(card);
    }
    if (panel) {
      const first = panel.initialFocus ? panel.initialFocus() : panel.drawer;
      (first || panel.drawer).focus({ preventScroll: true });
    }
  }

  function buildMissing(id) {
    const P = panel = { target: id, type: 'missing', isDirty: null };
    mountDrawer(P, false);
    const head = h('div', 'dr-head');
    head.appendChild(headRow(P, { id }, true));
    const t = h('h2', 'dr-title', 'Card not found');
    t.id = 'drawer-title';
    head.appendChild(t);
    const body = h('div', 'dr-body');
    body.appendChild(h('p', 'muted', 'There is no card ' + id + ' on this board. It may have been deleted.'));
    P.drawer.append(head, body);
    head.querySelector('.dr-head-row .muted').textContent = id;
  }

  function panelKey(card) { return JSON.stringify([card, isRO(), isThread(card) ? sessionInfo(card.thread.parentSessionId) : null]); }
  function updatePanel() {
    if (!panel || panel.target === 'new') return;
    const card = findCard(panel.target);
    if (!card) {
      if (panel.type !== 'missing') { const id = panel.target; panel.isDirty = null; if (panel.dispose) panel.dispose(); elOverlay.replaceChildren(); panel = null; buildMissing(id); panel.drawer.focus({ preventScroll: true }); }
      return;
    }
    if (panel.type === 'missing') { const id = panel.target; panel = null; buildPanel(id); return; }
    const key = panelKey(card);
    if (key === panel.cardKey) return;
    panel.cardKey = key;
    panel.update(card);
  }

  // ---------- task / idea / create panel ----------

  function field(labelText, control, id) {
    const f = h('div', 'field');
    const l = h('label', null, labelText);
    l.htmlFor = id;
    control.id = id;
    f.append(l, control);
    return f;
  }
  function statusSelect() {
    const s = h('select', 'input');
    STATUSES.forEach((st) => { const o = h('option', null, label(st)); o.value = st; s.appendChild(o); });
    return s;
  }

  function buildTaskPanel(card) {
    const create = !card;
    const P = panel = { target: create ? 'new' : card.id, type: create ? 'create' : 'task', cardKey: card ? panelKey(card) : '', confirmDelete: false, msg: '' };
    mountDrawer(P, false);

    P.base = create ? { title: '', note: '', status: 'new', kind: 'task' } : { title: card.title, note: card.note || '', status: card.status, kind: card.kind };
    P.baseUpdatedAt = card ? card.updatedAt : '';

    const head = h('div', 'dr-head');
    const headRowWrap = h('div');
    head.appendChild(headRowWrap);
    const title = h('h2', 'dr-title', create ? 'New card' : card.title);
    title.id = 'drawer-title';
    head.appendChild(title);
    const seenWrap = h('div');
    head.appendChild(seenWrap);

    const body = h('div', 'dr-body');
    const warnSlot = h('div');
    const conflict = h('div', 'callout warn');
    conflict.hidden = true;
    conflict.appendChild(h('span', 'grow', 'This card was changed on the board while you were editing. Saving will overwrite those changes.'));
    const roNote = h('div', 'callout warn', READONLY_WHY);
    roNote.setAttribute('role', 'status');
    roNote.hidden = true;
    body.append(warnSlot, roNote, conflict);

    const fTitle = h('input', 'input');
    fTitle.type = 'text';
    fTitle.maxLength = 200;
    fTitle.value = P.base.title;
    fTitle.autocomplete = 'off';
    const titleErr = h('div', 'err');
    titleErr.hidden = true;
    titleErr.id = 'title-err';
    const fTitleWrap = field('Title', fTitle, 'f-title');
    fTitleWrap.appendChild(titleErr);
    const fNote = h('textarea', 'input');
    fNote.rows = 7;
    fNote.value = P.base.note;
    const fStatus = statusSelect();
    fStatus.value = P.base.status;
    body.appendChild(fTitleWrap);
    body.appendChild(field('Note', fNote, 'f-note'));
    let fKind = null;
    if (create) {
      fKind = h('select', 'input');
      ['task', 'idea'].forEach((k) => { const o = h('option', null, k); o.value = k; fKind.appendChild(o); });
      const row = h('div', 'row2');
      row.append(field('Status', fStatus, 'f-status'), field('Kind', fKind, 'f-kind'));
      body.appendChild(row);
    } else {
      body.appendChild(field('Status', fStatus, 'f-status'));
    }

    const metaKind = h('dd'), metaBy = h('dd'), metaCreated = h('dd'), metaUpdated = h('dd');
    if (!create) {
      const dl = h('dl', 'meta-grid');
      [['Kind', metaKind], ['Added by', metaBy], ['Created', metaCreated], ['Updated', metaUpdated]].forEach(([k, dd]) => { dl.appendChild(h('dt', null, k)); dl.appendChild(dd); });
      body.appendChild(dl);
    }

    const foot = h('div', 'dr-foot');
    P.drawer.append(head, body, foot);

    P.isDirty = () => {
      if (fTitle.value !== P.base.title || fNote.value !== P.base.note || fStatus.value !== P.base.status) return true;
      return create ? fKind.value !== P.base.kind : false;
    };
    P.initialFocus = () => (create ? fTitle : P.drawer);

    function refreshConflict() {
      conflict.hidden = !(!create && P.isDirty() && P.latestUpdatedAt && P.latestUpdatedAt !== P.baseUpdatedAt);
    }
    ['input', 'change'].forEach((ev) => body.addEventListener(ev, () => { P.msg = ''; msgEl.textContent = ''; if (!titleErr.hidden && fTitle.value.trim()) clearTitleErr(); refreshConflict(); }));

    function clearTitleErr() { titleErr.hidden = true; fTitle.removeAttribute('aria-invalid'); fTitle.removeAttribute('aria-describedby'); }
    function setTitleErr(text) { titleErr.textContent = text; titleErr.hidden = false; fTitle.setAttribute('aria-invalid', 'true'); fTitle.setAttribute('aria-describedby', 'title-err'); }

    P.showDiscard = () => {
      if (warnSlot.firstChild) { warnSlot.querySelector('button').focus(); return; }
      const c = h('div', 'callout warn');
      c.setAttribute('role', 'alert');
      c.appendChild(h('span', 'grow', 'You have unsaved changes. Discard them and close?'));
      const keep = plainBtn('Keep editing', 'small', () => { warnSlot.replaceChildren(); fTitle.focus(); });
      const discard = plainBtn('Discard changes', 'small danger', () => {
        fTitle.value = P.base.title; fNote.value = P.base.note; fStatus.value = P.base.status;
        if (fKind) fKind.value = P.base.kind;
        warnSlot.replaceChildren();
        navigateClose();
      });
      c.append(keep, discard);
      warnSlot.replaceChildren(c);
      keep.focus();
    };

    const msgEl = h('span', 'foot-note');
    msgEl.setAttribute('role', 'status');

    async function save() {
      const newTitle = fTitle.value.trim();
      if (!newTitle) { setTitleErr('A title is required.'); fTitle.focus(); return; }
      clearError();
      if (isRO()) return;
      const pk = selKey;
      const key = create ? 'create:' + pk : 'save:' + pk + ':' + card.id;
      await runAction(key, async () => {
        try {
          if (create) {
            const bodyObj = { title: newTitle, status: fStatus.value, kind: fKind.value };
            if (fNote.value.trim()) bodyObj.note = fNote.value.trim();
            const made = await api('POST', pp(pk, 'cards'), bodyObj);
            wrote();
            applyCard(made, pk);
            fTitle.value = P.base.title; fNote.value = P.base.note; fStatus.value = P.base.status; fKind.value = P.base.kind;
            if (panel === P && pk === selKey) {
              history.replaceState(null, '', location.pathname + location.search + hashFor(pk, made.id));
              syncFromHash();
            }
          } else {
            const patch = {};
            if (newTitle !== P.base.title) patch.title = newTitle;
            if (fNote.value !== P.base.note) patch.note = fNote.value;
            if (fStatus.value !== P.base.status) patch.status = fStatus.value;
            if (!Object.keys(patch).length) { P.msg = 'No changes to save.'; msgEl.textContent = P.msg; return; }
            const saved = await api('PATCH', pp(pk, 'cards/' + encodeURIComponent(card.id)), patch);
            wrote();
            P.base = { title: saved.title, note: saved.note || '', status: saved.status, kind: saved.kind };
            P.baseUpdatedAt = saved.updatedAt;
            P.latestUpdatedAt = saved.updatedAt;
            if (fTitle.value === saved.title) fTitle.value = saved.title; else if (fTitle.value.trim() === saved.title) fTitle.value = saved.title;
            P.msg = 'Saved.';
            msgEl.textContent = P.msg;
            applyCard(saved, pk);
            refreshConflict();
          }
        } catch (e) { showError(e.message); }
      });
      poll();
    }

    function cancel() {
      fTitle.value = P.base.title; fNote.value = P.base.note; fStatus.value = P.base.status;
      if (fKind) fKind.value = P.base.kind;
      navigateClose();
    }

    function renderFoot(focusFirst) {
      foot.replaceChildren();
      if (P.confirmDelete) {
        foot.appendChild(h('span', 'confirm-text', 'Delete ' + card.id + '? This cannot be undone.'));
        foot.appendChild(h('span', 'grow'));
        const del = actionBtn('Delete card', 'danger solid', 'delete:' + selKey + ':' + card.id, () => doDelete(card.id));
        const keep = plainBtn('Keep it', null, () => { P.confirmDelete = false; renderFoot(true); });
        foot.append(keep, del);
        if (focusFirst) keep.focus();
        syncBusy();
        return;
      }
      const ro = isRO();
      const saveBtn = actionBtn(create ? 'Create card' : 'Save', 'primary', create ? 'create:' + selKey : 'save:' + selKey + ':' + card.id, save);
      if (focusFirst) setTimeout(() => saveBtn.focus(), 0);
      saveBtn.title = ro ? READONLY_WHY : 'Save (Ctrl or Cmd + Enter)';
      if (ro) setOff(saveBtn, true);
      foot.append(saveBtn, plainBtn('Cancel', null, cancel), msgEl);
      foot.appendChild(h('span', 'grow'));
      if (!create) {
        const del = plainBtn('Delete', 'danger', () => { P.confirmDelete = true; renderFoot(true); });
        if (ro) { del.disabled = true; del.title = READONLY_WHY; }
        foot.appendChild(del);
      }
      syncBusy();
    }

    async function doDelete(id) {
      clearError();
      let ok = false;
      const pk = selKey;
      await runAction('delete:' + pk + ':' + id, async () => {
        try { await api('DELETE', pp(pk, 'cards/' + encodeURIComponent(id)), {}); ok = true; wrote(); }
        catch (e) { showError(e.message); P.confirmDelete = false; }
      });
      if (ok && panel === P && pk === selKey) {
        const idx = current.cards.findIndex((c) => c.id === id);
        if (idx >= 0) { const cards = current.cards.slice(); cards.splice(idx, 1); appliedSeq = ++pollSeq; lastRaw = null; current = Object.assign({}, current, { cards }); currentKey = JSON.stringify(current); }
        P.isDirty = null;
        returnFocus = { el: elNewBtn };
        navigateClose();
        renderBoard(false);
      } else if (panel === P) renderFoot();
      poll();
    }

    let roShown = null;
    function applyRO() {
      const ro = isRO();
      if (ro === roShown) return;
      roShown = ro;
      roNote.hidden = !ro;
      [fTitle, fNote, fStatus, fKind].forEach((f) => { if (f) { f.disabled = ro; f.title = ro ? READONLY_WHY : ''; } });
      if (ro) P.confirmDelete = false;
      renderFoot();
    }

    P.update = (c) => {
      P.latestUpdatedAt = c.updatedAt;
      title.textContent = c.title;
      headRowWrap.replaceChildren(headRow(P, c, false));
      seenWrap.replaceChildren();
      if (c.seenByClaude === false) {
        const u = h('div', 'unseen');
        u.style.marginTop = '6px';
        u.appendChild(shape('s-circle'));
        u.appendChild(h('span', null, 'Claude has not seen this yet'));
        seenWrap.appendChild(u);
      }
      // follow the server only for fields the user has not touched
      const nb = { title: c.title, note: c.note || '', status: c.status };
      [[fTitle, 'title'], [fNote, 'note'], [fStatus, 'status']].forEach(([f, k]) => {
        if (f.value === P.base[k]) { f.value = nb[k]; P.base[k] = nb[k]; }
      });
      P.base.kind = c.kind;
      if (!P.isDirty()) P.baseUpdatedAt = c.updatedAt;
      metaKind.textContent = c.kind;
      metaBy.textContent = c.source === 'user' ? 'You' : 'Claude';
      metaCreated.replaceChildren(timeEl(c.createdAt));
      metaUpdated.replaceChildren(timeEl(c.updatedAt));
      refreshConflict();
      applyRO();
    };

    if (create) {
