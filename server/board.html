<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Thread board</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --col: #eceff3;
  --text: #1b1f24;
  --muted: #566070;
  --border: #d9dde4;
  --border-strong: #b4bbc6;
  --accent: #1f56c4;
  --accent-hover: #1a48a6;
  --accent-bg: #e1eafb;
  --on-accent: #ffffff;
  --focus: #1f56c4;
  --scrim: rgba(15, 18, 24, 0.45);

  --did: #1d56b8;      --did-bg: #e2ebfb;
  --found: #0b6a69;    --found-bg: #dcf2f0;
  --decided: #6a3fc0;  --decided-bg: #ece5fa;
  --changed: #8a4b00;  --changed-bg: #fcebcd;
  --open: #a1235a;     --open-bg: #fbe2ed;
  --error: #b42318;    --error-bg: #fde8e6;

  --run: #1f56c4;      --run-bg: #e1eafb;
  --fin: #17703f;      --fin-bg: #dcf3e5;
  --fail: #b42318;     --fail-bg: #fde8e6;
  --end: #4f5968;      --end-bg: #e6e9ee;

  --warn: #8a5300;     --warn-bg: #fdf0d5;
  --danger: #b42318;   --danger-bg: #fde8e6;
  --ok: #17703f;
  --idea: #8a5300;
  --thread: #6a3fc0;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  --r1: 4px; --r2: 6px; --r3: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317;
    --surface: #1b1e24;
    --surface-2: #23272f;
    --col: #16191e;
    --text: #e6e9ee;
    --muted: #a0aab8;
    --border: #2c313a;
    --border-strong: #454c58;
    --accent: #7fa8ff;
    --accent-hover: #9bbcff;
    --accent-bg: #1c2a49;
    --on-accent: #0b1220;
    --focus: #8db3ff;
    --scrim: rgba(0, 0, 0, 0.6);

    --did: #8fb5ff;      --did-bg: #1c2a47;
    --found: #5fd6cb;    --found-bg: #112f2d;
    --decided: #bca4f7;  --decided-bg: #2a2145;
    --changed: #f0b45c;  --changed-bg: #3a2a10;
    --open: #f294b8;     --open-bg: #3d1a2b;
    --error: #ff948b;    --error-bg: #3a1e1c;

    --run: #8fb5ff;      --run-bg: #1c2a47;
    --fin: #62d392;      --fin-bg: #14301f;
    --fail: #ff948b;     --fail-bg: #3a1e1c;
    --end: #aab3c0;      --end-bg: #272b33;

    --warn: #e8b35e;     --warn-bg: #36280f;
    --danger: #ff948b;   --danger-bg: #3a1e1c;
    --ok: #62d392;
    --idea: #e8b35e;
    --thread: #bca4f7;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13.5px/1.45 var(--sans);
  -webkit-text-size-adjust: 100%;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
.num, time, .count, .tnum { font-variant-numeric: tabular-nums; }
code, pre, .mono { font-family: var(--mono); }

#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* ---------- header and toolbar ---------- */
.top {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4) var(--s2);
}
.top h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.005em; flex: none; }
.dir {
  flex: 1 1 0; min-width: 0; display: flex; color: var(--muted);
  font: 12px var(--mono); white-space: nowrap;
}
.dir-head { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dir-tail { flex: none; }
.conn { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.conn .shape { color: var(--muted); }
.conn[data-state="online"] .shape { color: var(--ok); }
.conn[data-state="offline"] { color: var(--danger); font-weight: 600; }
.conn[data-state="offline"] .shape { color: var(--danger); }

.toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s2);
  padding: 0 var(--s4) var(--s3);
}
.search { position: relative; flex: 1 1 220px; max-width: 360px; min-width: 0; }
.search input { width: 100%; padding-right: 30px; }
.search .kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font: 11px var(--mono); color: var(--muted); border: 1px solid var(--border-strong);
  border-radius: var(--r1); padding: 0 5px; pointer-events: none; line-height: 16px;
}
.search input:focus + .kbd, .search input:not(:placeholder-shown) + .kbd { display: none; }
.toolbar-note { flex: 1 1 200px; min-width: 0; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: var(--s2); }
.toolbar-note:empty { display: none; }
.toolbar #new-btn { margin-left: auto; }

/* ---------- controls ---------- */
.input, input.input, textarea.input, select.input {
  width: 100%; min-height: 32px; padding: 5px 9px;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r2);
}
textarea.input { resize: vertical; line-height: 1.45; }
.input:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
.input::placeholder { color: var(--muted); opacity: 1; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 0 12px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--r2); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .btn.danger.solid { color: #1a0a09; } }
.btn.danger.solid:hover:not(:disabled) { filter: brightness(0.92); background: var(--danger); }
.btn.small { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.btn.busy { color: transparent !important; pointer-events: none; }
.btn.busy::after {
  content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--muted); border-top-color: transparent; animation: spin 0.8s linear infinite;
}
.btn.primary.busy::after { border-color: var(--on-accent); border-top-color: transparent; }
.btn.icon { width: 32px; padding: 0; font-size: 20px; line-height: 1; }
kbd.hint { font: 11px var(--mono); opacity: 0.8; border: 1px solid currentColor; border-radius: var(--r1); padding: 0 4px; line-height: 15px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- shapes (markers that never rely on colour alone) ---------- */
.shape { display: inline-block; width: 10px; height: 10px; flex: none; position: relative; color: var(--k, var(--muted)); }
.s-circle { border-radius: 50%; background: currentColor; }
.s-ring { border-radius: 50%; border: 2px solid currentColor; }
.s-dring { border-radius: 50%; border: 2px dashed currentColor; }
.s-square { border-radius: 2px; background: currentColor; }
.s-diamond { background: currentColor; transform: rotate(45deg) scale(0.82); }
.s-hdiamond { border: 2px solid currentColor; transform: rotate(45deg) scale(0.82); }
.s-pulse { border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
.s-check { width: 6px; height: 10px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -2px); margin: 0 2px; }
.s-cross::before, .s-cross::after { content: ""; position: absolute; left: 4px; top: -1px; width: 2px; height: 12px; background: currentColor; border-radius: 1px; }
.s-cross::before { transform: rotate(45deg); }
.s-cross::after { transform: rotate(-45deg); }

[data-kind="did"] { --k: var(--did); --kbg: var(--did-bg); }
[data-kind="found"] { --k: var(--found); --kbg: var(--found-bg); }
[data-kind="decided"] { --k: var(--decided); --kbg: var(--decided-bg); }
[data-kind="changed"] { --k: var(--changed); --kbg: var(--changed-bg); }
[data-kind="open"] { --k: var(--open); --kbg: var(--open-bg); }
[data-kind="error"] { --k: var(--error); --kbg: var(--error-bg); }
[data-kind="working"] { --k: var(--run); --kbg: var(--run-bg); }
[data-run="running"] { --k: var(--run); --kbg: var(--run-bg); }
[data-run="idle"] { --k: var(--fin); --kbg: var(--fin-bg); }
[data-run="failed"] { --k: var(--fail); --kbg: var(--fail-bg); }
[data-run="ended"] { --k: var(--end); --kbg: var(--end-bg); }
[data-ck="task"] { --k: var(--muted); }
[data-ck="idea"] { --k: var(--idea); }
[data-ck="thread"] { --k: var(--thread); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px 1px 6px;
  border-radius: var(--r1); font-size: 12px; font-weight: 600; line-height: 18px;
  color: var(--k); background: var(--kbg); white-space: nowrap;
}
.idchip {
  display: inline-block; font: 600 12px/18px var(--mono); padding: 0 6px; border-radius: var(--r1);
  background: var(--surface-2); color: var(--text); border: 1px solid var(--border); white-space: nowrap;
}
.kindmark { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.kindmark .shape { width: 9px; height: 9px; }
.refchip {
  display: inline-block; font: 12px/18px var(--mono); padding: 0 6px; border-radius: var(--r1);
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); overflow-wrap: anywhere;
}
.muted { color: var(--muted); }
.warn-text { color: var(--warn); }

/* ---------- board ---------- */
.board {
  flex: 1 1 0; min-height: 0; overflow-x: auto; overflow-y: hidden;
  display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); grid-template-rows: minmax(0, 1fr);
  gap: var(--s2); padding: 0 var(--s4) var(--s4);
}
.col {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--col); border: 1px solid var(--border); border-radius: var(--r3);
}
.col.over { background: var(--accent-bg); border-color: var(--accent); outline: 2px dashed var(--accent); outline-offset: -3px; }
.col-head { display: flex; align-items: center; justify-content: space-between; padding: var(--s2) var(--s3) 6px; flex: none; }
.col-head h2 { margin: 0; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.count {
  min-width: 22px; padding: 0 6px; text-align: center; font-size: 12px; line-height: 18px;
  color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r1);
}
.col-body { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 6px 8px; }
.col-empty {
  margin: 4px 2px; padding: var(--s3); text-align: center; font-size: 12.5px; color: var(--muted);
  border: 1px dashed var(--border-strong); border-radius: var(--r2);
}

.card {
  flex: none; display: flex; flex-direction: column; gap: 5px; padding: 8px 10px 9px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2);
  cursor: pointer; min-width: 0; text-align: left;
}
.card:hover { border-color: var(--border-strong); }
.card:focus-visible { outline-offset: -2px; }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: 0.4; }
.card.is-thread { border-left: 3px solid var(--thread); padding-left: 8px; }
.card-top { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.card-title {
  margin: 0; font-size: 13.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-note { margin: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s2); font-size: 12px; color: var(--muted); }
.unseen { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--warn); }
.unseen .shape { color: var(--warn); width: 7px; height: 7px; }

/* ---------- banner ---------- */
.banner {
  position: fixed; z-index: 60; top: var(--s3); left: 50%; transform: translateX(-50%);
  width: min(640px, calc(100vw - 24px)); display: flex; align-items: flex-start; gap: var(--s3);
  padding: var(--s2) var(--s3); background: var(--danger-bg); color: var(--text);
  border: 1px solid var(--danger); border-radius: var(--r2);
}
.banner .banner-text { flex: 1; min-width: 0; padding-top: 4px; overflow-wrap: anywhere; }

/* ---------- drawer ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade-in 0.15s ease-out; }
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100vw);
  display: flex; flex-direction: column; background: var(--surface); color: var(--text);
  border-left: 1px solid var(--border-strong); box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
  animation: slide-in 0.18s ease-out;
}
.drawer.wide { width: min(720px, 100vw); }
.drawer:focus { outline: none; }
.dr-head { flex: none; padding: var(--s3) var(--s4) var(--s3); border-bottom: 1px solid var(--border); }
.dr-head-row { display: flex; align-items: center; gap: var(--s2); min-height: 32px; }
.dr-head-row .grow { flex: 1 1 auto; }
.dr-title { margin: var(--s2) 0 0; font-size: 17px; line-height: 1.3; font-weight: 650; overflow-wrap: anywhere; }
.dr-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s3); margin-top: var(--s2); font-size: 12.5px; color: var(--muted); }
.dr-body { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.dr-foot {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2);
  padding: var(--s3) var(--s4); border-top: 1px solid var(--border); background: var(--surface);
}
.dr-foot .grow { flex: 1 1 auto; }
.foot-note { font-size: 12px; color: var(--muted); }
.confirm-text { font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .field .lbl { font-size: 12px; font-weight: 650; color: var(--muted); }
.field .err { font-size: 12px; color: var(--danger); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.meta-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--s4); margin: 0; font-size: 12.5px; padding-top: var(--s3); border-top: 1px solid var(--border); }
.meta-grid dt { color: var(--muted); }
.meta-grid dd { margin: 0; min-width: 0; }

.callout {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); padding: var(--s2) var(--s3);
  border-radius: var(--r2); border: 1px solid var(--border-strong); background: var(--surface-2); font-size: 13px;
}
.callout .grow { flex: 1 1 200px; min-width: 0; }
.callout.warn { background: var(--warn-bg); border-color: var(--warn); }
.callout.danger { background: var(--danger-bg); border-color: var(--danger); display: block; }
.callout.danger .callout-title { font-weight: 650; color: var(--danger); margin-bottom: 2px; }
.callout.danger .callout-body { overflow-wrap: anywhere; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }

/* thread header blocks */
.ids { margin: 0; border-bottom: 1px solid var(--border); }
.ids > summary {
  list-style: none; cursor: pointer; padding: 6px var(--s4); font-size: 12px; font-weight: 650;
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: var(--s2);
}
.ids > summary::-webkit-details-marker { display: none; }
.ids > summary::before { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform 0.12s; }
.ids[open] > summary::before { transform: rotate(45deg); }
.ids-peek { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--mono); font-size: 12px; margin-left: var(--s2); }
.ids[open] .ids-peek { display: none; }
.ids-body { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; align-items: center; gap: 6px var(--s3); padding: 0 var(--s4) var(--s3); }
.ids-body .k { font-size: 12px; color: var(--muted); }
.ids-body .v { font: 12px var(--mono); overflow-wrap: anywhere; user-select: all; }
.ids-note { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--muted); }

.tabs { flex: none; display: flex; gap: 2px; padding: 0 var(--s3); border-bottom: 1px solid var(--border); }
.tab {
  position: relative; background: none; border: 0; border-radius: var(--r2) var(--r2) 0 0; cursor: pointer;
  padding: 0 var(--s3); min-height: 38px; color: var(--muted); font-weight: 600;
}
.tab:hover { color: var(--text); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: var(--s2); right: var(--s2); bottom: -1px; height: 2px; background: var(--accent); }
.tab:focus-visible { outline-offset: -2px; }
.tabpanels { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.tabpanel { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.scroller { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: var(--s4); }
.scroller:focus-visible { outline-offset: -3px; }

/* trace */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--s4); }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 9px; cursor: pointer;
  background: var(--kbg); color: var(--k); border: 1px solid transparent; border-radius: var(--r2); font-size: 12.5px; font-weight: 600;
}
.fchip[aria-pressed="false"] { background: transparent; color: var(--muted); border: 1px dashed var(--border-strong); font-weight: 500; }
.fchip[aria-pressed="false"] .shape { opacity: 0.6; }
.fchip .n { font-weight: 700; }
.turn-block + .turn-block { margin-top: var(--s5); }
.turn-head { display: flex; align-items: baseline; gap: var(--s2); margin: 0 0 var(--s2); font-size: 12.5px; font-weight: 650; }
.turn-head .tnum { color: var(--muted); font-weight: 600; flex: none; }
.turn-head .tp { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn-head .when { margin-left: auto; flex: none; font-weight: 400; color: var(--muted); font-size: 12px; }
.rail { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: var(--s3); padding-bottom: var(--s3); }
.step:last-child { padding-bottom: 0; }
.step::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: -2px; width: 2px; background: var(--border-strong); opacity: 0.6; }
.step:last-child::before { display: none; }
.node { position: relative; z-index: 1; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; background: var(--surface); }
.node .shape { width: 11px; height: 11px; }
.node.err { background: var(--error); border-radius: 50%; color: #fff; }
.node.err .shape { color: #fff; width: 10px; height: 10px; }
@media (prefers-color-scheme: dark) { .node.err { color: #1a0a09; } .node.err .shape { color: #1a0a09; } }
.step-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px var(--s2); min-height: 20px; }
.klabel { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--k); }
.step-text { margin-top: 1px; overflow-wrap: anywhere; }
.step-text code, .md code { font-size: 0.92em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
.step.err .step-text { font: 12.5px var(--mono); white-space: pre-wrap; color: var(--text); }
.step .elapsed { font-variant-numeric: tabular-nums; color: var(--muted); }

.empty-state { padding: var(--s5) var(--s4); text-align: center; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: var(--r3); }
.empty-state strong { display: block; color: var(--text); margin-bottom: 2px; }

/* conversation */
.convo { display: flex; flex-direction: column; gap: var(--s4); }
.msg { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.msg-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--s2); font-size: 12px; color: var(--muted); }
.msg-meta strong { color: var(--text); font-weight: 650; }
.msg.user { align-items: flex-end; }
.msg.user .msg-meta { justify-content: flex-end; }
.msg.user .bubble { background: var(--accent-bg); border-color: transparent; white-space: pre-wrap; max-width: 92%; }
.msg.bot .bubble { background: var(--surface); width: 100%; }
.bubble { padding: var(--s2) var(--s3); border: 1px solid var(--border); border-radius: var(--r3); overflow-wrap: anywhere; min-width: 0; }
.bubble > * + * { margin-top: var(--s3); }
.sec-title { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--k); }
.typing { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: var(--s2) var(--s3); border: 1px solid var(--border); border-radius: var(--r3); color: var(--muted); }
.typing .dots { display: inline-flex; gap: 3px; }
.typing .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--run); animation: blink 1.2s infinite; }
.typing .dots i:nth-child(2) { animation-delay: 0.2s; }
.typing .dots i:nth-child(3) { animation-delay: 0.4s; }

.composer { flex: none; border-top: 1px solid var(--border); padding: var(--s3) var(--s4); background: var(--surface); display: flex; flex-direction: column; gap: var(--s2); }
.composer textarea { min-height: 52px; max-height: 40vh; }
.composer-row { display: flex; align-items: center; gap: var(--s3); }
.composer-row .reason { flex: 1 1 auto; font-size: 12.5px; color: var(--muted); min-width: 0; }
.composer-row .reason.blocked { color: var(--text); }

/* markdown subset */
.md { font-size: 13.5px; }
.md > * + * { margin-top: var(--s2); }
.md p { margin: 0; }
.md ul, .md ol { margin: 0; padding-left: 20px; }
.md li + li { margin-top: 3px; }
.md li > ul, .md li > ol { margin-top: 3px; }
.md h4 { margin: var(--s3) 0 0; font-size: 13.5px; font-weight: 700; }
.md h4.l1 { font-size: 15px; }
.md pre { margin: 0; padding: var(--s2) var(--s3); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r2); overflow-x: auto; font-size: 12px; line-height: 1.5; }
.md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.md strong { font-weight: 700; }

/* digest */
.dg-grid { display: flex; flex-direction: column; gap: var(--s3); }
.dg-block { border: 1px solid var(--border); border-left: 3px solid var(--k); border-radius: var(--r2); padding: var(--s2) var(--s3) var(--s3); }
.dg-block .none { color: var(--muted); font-style: italic; }
.dg-h { margin: var(--s5) 0 var(--s2); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.dg-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin-bottom: var(--s3); font-size: 12.5px; color: var(--muted); }
.decisions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
.decisions li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: var(--s2); align-items: baseline; }
.decisions .tn { font: 600 11.5px var(--mono); color: var(--decided); background: var(--decided-bg); border-radius: var(--r1); padding: 0 5px; text-align: center; }
.report-note { margin-top: var(--s4); }
.report-note code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 12.5px; }

@media (max-width: 760px) {
  .top { padding: var(--s3) var(--s3) var(--s2); }
  .toolbar { padding: 0 var(--s3) var(--s3); }
  .search { flex-basis: 100%; max-width: none; }
  .toolbar-note { order: 3; flex-basis: 100%; }
  .board { padding: 0 var(--s3) var(--s3); grid-template-columns: repeat(6, 264px); scroll-snap-type: x proximity; }
  .col { scroll-snap-align: start; }
  .drawer, .drawer.wide { width: 100vw; border-left: 0; }
  .row2 { grid-template-columns: 1fr; }
  .ids-body { grid-template-columns: minmax(0, 1fr) auto; }
  .ids-body .k { grid-column: 1 / -1; margin-bottom: -4px; }
  .dr-head, .dr-body, .scroller, .composer, .dr-foot { padding-left: var(--s3); padding-right: var(--s3); }
  .ids > summary, .ids-body { padding-left: var(--s3); padding-right: var(--s3); }
  .decisions li { grid-template-columns: 1fr; gap: 2px; }
  .decisions .tn { justify-self: start; padding: 0 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .s-pulse { opacity: 1; }
  .btn.busy::after { border-top-color: var(--muted); }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Thread board</h1>
    <span class="dir" id="dir"><span class="dir-head" id="dir-head"></span><span class="dir-tail" id="dir-tail"></span></span>
    <span class="conn" id="conn" role="status" data-state="connecting"><span class="shape s-ring"></span><span id="conn-text">Connecting</span></span>
  </header>
  <div class="toolbar" role="search">
    <div class="search">
      <input class="input" id="search" type="search" placeholder="Search id, title or note" aria-label="Search cards by id, title or note" autocomplete="off" spellcheck="false">
      <span class="kbd" aria-hidden="true">/</span>
    </div>
    <button type="button" class="btn" id="threads-only" aria-pressed="false">Threads only</button>
    <span class="toolbar-note" id="filter-note" aria-live="polite"></span>
    <button type="button" class="btn primary" id="new-btn" aria-keyshortcuts="n">New card <kbd class="hint" aria-hidden="true">N</kbd></button>
  </div>
  <main class="board" id="board" aria-label="Board columns"></main>
</div>

<div class="banner" id="banner" role="alert" hidden>
  <div class="banner-text" id="banner-text"></div>
  <button type="button" class="btn small" id="banner-close">Dismiss</button>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(function () {
  'use strict';

  const STATUSES = ['idea', 'new', 'in_progress', 'review', 'blocked', 'done'];
  const LABELS = { idea: 'Idea', new: 'New', in_progress: 'In progress', review: 'Review', blocked: 'Blocked', done: 'Done' };
  const EMPTY = {
    idea: 'No ideas yet. Park half-formed thoughts here.',
    new: 'Nothing waiting. New work lands here.',
    in_progress: 'Nothing in progress right now.',
    review: 'Nothing to review.',
    blocked: 'Nothing is blocked.',
    done: 'Nothing finished yet.',
  };
  const KINDS = ['did', 'found', 'decided', 'changed', 'open'];
  const KIND_LABEL = { did: 'Did', found: 'Found', decided: 'Decided', changed: 'Changed', open: 'Open' };
  const KIND_SHAPE = { did: 's-circle', found: 's-hdiamond', decided: 's-diamond', changed: 's-square', open: 's-dring' };
  const SECTIONS = [['happened', 'Happened', 'did'], ['decided', 'Decided', 'decided'], ['changed', 'Changed', 'changed'], ['open', 'Open', 'open']];
  const RUN = { running: 'Running', idle: 'Finished', failed: 'Failed', ended: 'Ended' };
  const RUN_SHAPE = { running: 's-pulse', idle: 's-check', failed: 's-cross', ended: 's-square' };
  const CK_SHAPE = { task: 's-square', idea: 's-diamond', thread: 's-ring' };
  const POLL_MS = 2000;

  const $ = (id) => document.getElementById(id);
  const elApp = $('app'), elBoard = $('board'), elSearch = $('search'), elThreadsOnly = $('threads-only');
  const elNote = $('filter-note'), elNewBtn = $('new-btn'), elOverlay = $('overlay');
  const elBanner = $('banner'), elBannerText = $('banner-text');

  let current = null;        // newest state from the server
  let currentKey = '';
  let lastRaw = null;
  let pollSeq = 0, appliedSeq = 0;
  let boardKey = null;
  let dragId = null, pendingRender = false, lastDragEnd = 0;
  let panel = null;          // the open drawer, if any
  let hashPushed = false;    // true when the open panel added a history entry
  let returnFocus = null;    // where focus goes when the panel closes
  let synced = false;
  const drafts = {};         // composer drafts by thread id
  const inflight = {};       // request keys currently in flight

  // ---------- small helpers ----------

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function shape(cls) { const s = h('span', 'shape ' + cls); s.setAttribute('aria-hidden', 'true'); return s; }
  function label(status) { return LABELS[status] || String(status); }
  function findCard(id) {
    if (!current) return null;
    for (const c of current.cards) if (c.id === id) return c;
    return null;
  }
  function isThread(c) { return c.kind === 'thread' && !!c.thread; }
  function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, ''); }
  function turnsOf(c) { return (c.thread && Array.isArray(c.thread.turns)) ? c.thread.turns : []; }

  function exact(iso) {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'medium' });
  }
  function rel(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const s = Math.round((Date.now() - d.getTime()) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return s + ' s ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + ' min ago';
    const hr = Math.floor(m / 60);
    if (hr < 24) return hr + ' h ago';
    const dd = Math.floor(hr / 24);
    if (dd < 14) return dd + ' d ago';
    return d.toLocaleDateString(undefined, { dateStyle: 'medium' });
  }
  function timeEl(iso) {
    const t = h('time', null, rel(iso));
    t.dateTime = iso || '';
    t.title = exact(iso);
    t.dataset.rel = iso || '';
    return t;
  }
  function fmtMs(ms) {
    let s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + 's';
    let m = Math.floor(s / 60); s = s % 60;
    if (m < 60) return m + 'm ' + String(s).padStart(2, '0') + 's';
    const hr = Math.floor(m / 60); m = m % 60;
    return hr + 'h ' + String(m).padStart(2, '0') + 'm';
  }
  function elapsedEl(iso) {
    const e = h('span', 'elapsed', fmtMs(Date.now() - new Date(iso).getTime()));
    e.dataset.since = iso;
    return e;
  }
  setInterval(() => {
    document.querySelectorAll('time[data-rel]').forEach((t) => {
      const v = rel(t.dataset.rel);
      if (t.textContent !== v) t.textContent = v;
    });
    document.querySelectorAll('[data-since]').forEach((e) => {
      const v = fmtMs(Date.now() - new Date(e.dataset.since).getTime());
      if (e.textContent !== v) e.textContent = v;
    });
  }, 1000);

  function isTyping(t) {
    if (!t || !t.tagName) return false;
    const n = t.tagName;
    return n === 'INPUT' || n === 'TEXTAREA' || n === 'SELECT' || t.isContentEditable;
  }

  // ---------- errors, connection, busy buttons ----------

  function showError(message) {
    elBannerText.textContent = String(message || 'Something went wrong.');
    elBanner.hidden = false;
  }
  function clearError() { elBanner.hidden = true; }
  $('banner-close').addEventListener('click', () => {
    clearError();
    if (panel && panel.drawer) panel.drawer.focus({ preventScroll: true });
  });

  function setOnline(ok) {
    const state = ok ? 'online' : 'offline';
    const el = $('conn');
    if (el.dataset.state === state) return;
    el.dataset.state = state;
    $('conn-text').textContent = ok ? 'Online' : 'Offline';
    el.querySelector('.shape').className = 'shape ' + (ok ? 's-circle' : 's-cross');
  }

  function syncBusy() {
    document.querySelectorAll('[data-busykey]').forEach((b) => {
      const busy = !!inflight[b.dataset.busykey];
      b.classList.toggle('busy', busy);
      if (busy) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
      b.disabled = busy || b.dataset.off === '1';
    });
  }
  async function runAction(key, fn) {
    if (inflight[key]) return undefined;
    inflight[key] = true;
    syncBusy();
    try { return await fn(); }
    finally { delete inflight[key]; syncBusy(); }
  }
  // A button tied to a request key: busy while in flight, never double-submitted.
  function actionBtn(text, cls, key, onClick) {
    const b = h('button', 'btn' + (cls ? ' ' + cls : ''), text);
    b.type = 'button';
    b.dataset.busykey = key;
    b.addEventListener('click', () => { if (!inflight[key] && b.dataset.off !== '1') onClick(b); });
    return b;
  }
  function setOff(b, off) { b.dataset.off = off ? '1' : '0'; b.disabled = off || !!inflight[b.dataset.busykey]; }
  function plainBtn(text, cls, onClick) {
    const b = h('button', 'btn' + (cls ? ' ' + cls : ''), text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }

  // ---------- network ----------

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' }, cache: 'no-store' };
    if (method !== 'GET') opts.body = JSON.stringify(body || {});
    let res;
    try { res = await fetch(path, opts); }
    catch (e) { throw new Error('Could not reach the board server.'); }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) throw new Error((data && data.error) ? data.error : 'Request failed (status ' + res.status + ')');
    return data;
  }

  async function poll() {
    const seq = ++pollSeq;
    let text;
    try {
      const opts = { cache: 'no-store' };
      if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) opts.signal = AbortSignal.timeout(5000);
      const res = await fetch('/api/state', opts);
      if (!res.ok) throw new Error('status ' + res.status);
      text = await res.text();
    } catch (e) {
      if (seq > appliedSeq) setOnline(false);
      return;
    }
    if (seq < appliedSeq) return;
    appliedSeq = seq;
    setOnline(true);
    if (text === lastRaw) return;               // nothing changed: no DOM work
    let data;
    try { data = JSON.parse(text); } catch (e) { return; }
    if (!data || !Array.isArray(data.cards)) return;
    lastRaw = text;
    try { apply(data); } catch (e) { console.error(e); }
  }

  // Use a card the server just returned without waiting for the next poll.
  function applyCard(card) {
    if (!current || !card) return;
    const cards = current.cards.slice();
    const i = cards.findIndex((c) => c.id === card.id);
    if (i >= 0) cards[i] = card; else cards.push(card);
    appliedSeq = ++pollSeq;                     // older polls still in flight are ignored
    lastRaw = null;
    apply(Object.assign({}, current, { cards }));
  }

  function apply(data) {
    current = data;
    currentKey = JSON.stringify(data);
    setDir(data.projectDir ? String(data.projectDir) : '');
    renderBoard(false);
    if (!synced) { synced = true; syncFromHash(); }
    else updatePanel();
  }

  let dirShown = null;
  function setDir(dir) {
    if (dir === dirShown) return;
    dirShown = dir;
    const cut = Math.max(dir.lastIndexOf('/'), dir.lastIndexOf('\\'));
    $('dir-head').textContent = cut > 0 ? dir.slice(0, cut) : '';
    $('dir-tail').textContent = cut > 0 ? dir.slice(cut) : dir;
    $('dir').title = dir;
  }

  // ---------- board ----------

  function filterState() {
    return { q: elSearch.value.trim().toLowerCase(), threadsOnly: elThreadsOnly.getAttribute('aria-pressed') === 'true' };
  }
  function matches(c, f) {
    if (f.threadsOnly && !isThread(c)) return false;
    if (!f.q) return true;
    return (c.id + ' ' + c.title + ' ' + (c.note || '')).toLowerCase().includes(f.q);
  }

  function renderBoard(force) {
    if (!current) return;
    if (dragId !== null) { pendingRender = true; return; }
    const f = filterState();
    const key = currentKey + '|' + f.q + '|' + f.threadsOnly;
    if (!force && key === boardKey) return;
    boardKey = key;
    pendingRender = false;

    const scrollLeft = elBoard.scrollLeft;
    const colScroll = {};
    elBoard.querySelectorAll('.col').forEach((c) => { colScroll[c.dataset.status] = c.querySelector('.col-body').scrollTop; });
    const a = document.activeElement;
    const focusId = (a && a.classList && a.classList.contains('card') && elBoard.contains(a)) ? a.dataset.id : null;

    const filtering = !!(f.q || f.threadsOnly);
    const shown = current.cards.filter((c) => matches(c, f));
    const byStatus = {};
    STATUSES.forEach((s) => { byStatus[s] = []; });
    shown.forEach((c) => { if (byStatus[c.status]) byStatus[c.status].push(c); });

    const frag = document.createDocumentFragment();
    STATUSES.forEach((s) => frag.appendChild(buildColumn(s, byStatus[s], filtering)));
    elBoard.replaceChildren(frag);
    elBoard.scrollLeft = scrollLeft;
    elBoard.querySelectorAll('.col').forEach((c) => {
      if (colScroll[c.dataset.status]) c.querySelector('.col-body').scrollTop = colScroll[c.dataset.status];
    });
    if (focusId) {
      const t = elBoard.querySelector('.card[data-id="' + cssEscape(focusId) + '"]');
      if (t) t.focus({ preventScroll: true });
    }

    // the line beside the toolbar
    elNote.replaceChildren();
    if (!current.cards.length) {
      elNote.textContent = 'The board is empty. Press N to add the first card.';
    } else if (filtering) {
      const total = current.cards.length;
      if (!shown.length) {
        const what = f.q ? 'No cards match “' + elSearch.value.trim() + '”' + (f.threadsOnly ? ' among threads.' : '.') : 'No threads on the board yet.';
        elNote.appendChild(h('span', null, what));
      } else {
        elNote.appendChild(h('span', 'tnum', 'Showing ' + shown.length + ' of ' + total + ' cards.'));
      }
      const clear = plainBtn('Clear filters', 'small', () => {
        elSearch.value = '';
        elThreadsOnly.setAttribute('aria-pressed', 'false');
        renderBoard(true);
        elSearch.focus();
      });
      elNote.appendChild(clear);
    }
  }

  function buildColumn(status, cards, filtering) {
    const col = h('section', 'col');
    col.dataset.status = status;
    col.setAttribute('aria-label', label(status) + ', ' + cards.length + (cards.length === 1 ? ' card' : ' cards'));

    const head = h('div', 'col-head');
    head.appendChild(h('h2', null, label(status)));
    head.appendChild(h('span', 'count', String(cards.length)));
    col.appendChild(head);

    const body = h('div', 'col-body');
    if (!cards.length) body.appendChild(h('div', 'col-empty', filtering ? 'No matching cards in this column.' : EMPTY[status]));
    cards.forEach((c) => body.appendChild(buildCard(c)));
    col.appendChild(body);

    col.addEventListener('dragenter', (e) => { if (dragId === null) return; e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragover', (e) => {
      if (dragId === null) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      col.classList.add('over');
    });
    col.addEventListener('dragleave', (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', (e) => {
      if (dragId === null) return;
      e.preventDefault();
      const id = dragId;
      endDrag();
      moveCard(id, status);
    });
    return col;
  }

  function buildCard(card) {
    const thread = isThread(card);
    const t = thread ? card.thread : null;
    const el = h('article', 'card' + (thread ? ' is-thread' : ''));
    el.dataset.id = card.id;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');

    const top = h('div', 'card-top');
    top.appendChild(h('span', 'idchip', card.id));
    const kind = thread ? 'thread' : String(card.kind);
    const km = h('span', 'kindmark');
    km.dataset.ck = kind;
    km.appendChild(shape(CK_SHAPE[kind] || 's-square'));
    km.appendChild(h('span', null, kind));
    top.appendChild(km);
    el.appendChild(top);

    el.appendChild(h('h3', 'card-title', card.title));
    if (card.note) el.appendChild(h('p', 'card-note', card.note));

    const foot = h('div', 'card-foot');
    if (thread) {
      foot.appendChild(runPill(t.runState));
      const n = turnsOf(card).length;
      foot.appendChild(h('span', 'tnum', n + (n === 1 ? ' turn' : ' turns')));
      if (t.runState !== 'running' && hasResult(card) && !t.reported) foot.appendChild(h('span', 'warn-text', 'not reported'));
    }
    if (card.seenByClaude === false) {
      const u = h('span', 'unseen');
      u.appendChild(shape('s-circle'));
      u.appendChild(h('span', null, 'Claude has not seen this yet'));
      foot.appendChild(u);
    }
    if (foot.childNodes.length) el.appendChild(foot);

    el.setAttribute('aria-label', card.id + ', ' + kind + ', ' + card.title + (thread ? ', ' + (RUN[t.runState] || t.runState).toLowerCase() : '') + (card.seenByClaude === false ? ', Claude has not seen this yet' : ''));

    el.addEventListener('click', () => {
      if (Date.now() - lastDragEnd < 200) return;
      openCard(card.id, el);
    });
    el.addEventListener('keydown', (e) => {
      if (e.target !== el) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(card.id, el); }
    });

    if (!thread) {
      el.draggable = true;
      el.addEventListener('dragstart', (e) => {
        dragId = card.id;
        e.dataTransfer.effectAllowed = 'move';

  async function moveCard(id, status) {

  // ---------- markdown subset (DOM nodes only) ----------

  const BULLET_RE = /^(\s*)(?:[-*+•])\s+(.*)$/;
  const NUM_RE = /^(\s*)\d+[.)]\s+(.*)$/;
  const NONE_RE = /^(none|nothing|nil|n\/a|no changes?|no open (?:items?|questions?|issues?)|no decisions?)(?!\s+of\b)\b.{0,48}$/i;

  function inline(parent, text) {
    const re = /(`+)([^`]+?)\1|\*\*([^*]+?)\*\*|__([^_]+?)__/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[2] !== undefined) parent.appendChild(h('code', null, m[2]));
      else parent.appendChild(h('strong', null, m[3] !== undefined ? m[3] : m[4]));
      last = re.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function inlineEl(tag, cls, text) { const e = h(tag, cls); inline(e, text); return e; }

  function renderMarkdown(src) {
    const root = h('div', 'md');
    const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
    let i = 0, para = [];
    const flush = () => { if (para.length) { root.appendChild(inlineEl('p', null, para.join(' '))); para = []; } };
    while (i < lines.length) {
      const line = lines[i];
      let m = /^\s*(```+|~~~+)/.exec(line);
      if (m) {
        flush();
        const fence = m[1][0];
        const buf = [];
        i++;
        while (i < lines.length && !new RegExp('^\\s*' + (fence === '`' ? '```' : '~~~')).test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        const pre = h('pre');
        pre.tabIndex = 0;
        pre.appendChild(h('code', null, buf.join('\n')));
        root.appendChild(pre);
        continue;
      }
      if (/^\s*$/.test(line)) { flush(); i++; continue; }
      m = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line);
      if (m) { flush(); root.appendChild(inlineEl('h4', m[1].length <= 2 ? 'l1' : '', m[2])); i++; continue; }
      if (BULLET_RE.test(line) || NUM_RE.test(line)) {
        flush();
        const ordered = !BULLET_RE.test(line);
        const baseIndent = (BULLET_RE.exec(line) || NUM_RE.exec(line))[1].length;
        const list = h(ordered ? 'ol' : 'ul');
        let lastLi = null, nested = null;
        while (i < lines.length) {
          const l = lines[i];
          const bm = BULLET_RE.exec(l), nm = NUM_RE.exec(l);
          const mm = bm || nm;
          if (mm) {
            const indent = mm[1].length;
            if (indent >= baseIndent + 2 && lastLi) {
              if (!nested) { nested = h(bm ? 'ul' : 'ol'); lastLi.appendChild(nested); }
              nested.appendChild(inlineEl('li', null, mm[2]));
            } else {
              nested = null;
              lastLi = inlineEl('li', null, mm[2]);
              list.appendChild(lastLi);
            }
            i++;
          } else if (/^\s+\S/.test(l) && lastLi) {
            lastLi.appendChild(document.createTextNode(' ' + l.trim()));
            i++;
          } else break;
        }
        root.appendChild(list);
        continue;
      }
      para.push(line.trim());
      i++;
    }
    flush();
    return root;
  }

  // Digest text -> clean items; none-like lines are dropped.
  function isNone(s) {
    const t = String(s).replace(/[*_`]/g, '').trim().replace(/[.;:!\s]+$/, '');
    return !t || NONE_RE.test(t);
  }
  function itemsOf(text) {
    const out = [];
    String(text || '').replace(/\r\n?/g, '\n').split('\n').forEach((raw) => {
      if (!raw.trim() || /^\s*#{1,6}\s/.test(raw)) return;
      const m = BULLET_RE.exec(raw) || NUM_RE.exec(raw);
      if (m) out.push(m[2].trim());
      else if (out.length && /^\s+/.test(raw)) out[out.length - 1] += ' ' + raw.trim();
      else out.push(raw.trim());
    });
    return out.filter((s) => !isNone(s));
  }

  // Fallback if the server did not attach a view.
  function viewOf(turn) {
    if (turn.view && typeof turn.view === 'object') return turn.view;
    if (typeof turn.result !== 'string') return null;
    const out = { body: '', sections: { happened: '', decided: '', changed: '', open: '' }, map: [] };
    const re = /^##\s+(Happened|Decided|Changed|Open)\s*$/gim;
    const marks = [];
    let m;
    while ((m = re.exec(turn.result)) !== null) marks.push({ k: m[1].toLowerCase(), s: m.index, e: re.lastIndex });
    if (!marks.length) { out.body = turn.result.trim(); return out; }
    out.body = turn.result.slice(0, marks[0].s).trim();
    marks.forEach((mk, i) => { out.sections[mk.k] = turn.result.slice(mk.e, i + 1 < marks.length ? marks[i + 1].s : undefined).trim(); });
    return out;
  }

  // ---------- trace model ----------

  function turnState(card, i) {
    const t = turnsOf(card)[i];
    if (t.ok === false) return 'failed';

    return 'pending';
  }
  function stepsOf(turn) {
    const v = viewOf(turn);
    if (!v) return [];
    if (Array.isArray(v.map) && v.map.length) return v.map.map((s) => ({ kind: KINDS.includes(s.kind) ? s.kind : 'did', text: String(s.text || ''), ref: s.ref }));
    const out = [];
    SECTIONS.forEach(([key, , kind]) => itemsOf(v.sections && v.sections[key]).forEach((text) => out.push({ kind, text })));
    return out;
  }
  function firstLine(s) { return String(s || '').split('\n').map((x) => x.trim()).find(Boolean) || ''; }

  // ---------- panel plumbing ----------

  function parseHash() {
    const raw = (location.hash || '').replace(/^#/, '');
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }

  function openCard(id, fromEl) {
    returnFocus = fromEl ? { id } : null;
    navigateOpen(id);
  }
  function openNew() { returnFocus = { el: elNewBtn }; navigateOpen('new'); }
  function navigateOpen(target) {
    if (panel) return;

  window.addEventListener('hashchange', syncFromHash);

  function syncFromHash() {

  function requestClose() {

  function navigateClose() {

  function removePanel(swapping) {

  function headRow(P, card, createMode) {

  function buildPanel(target) {

  function buildMissing(id) {

  }

  function updatePanel() {
    if (!panel || panel.target === 'new') return;
    const card = findCard(panel.target);
    if (!card) {

      return;
    }
    if (panel.type === 'missing') { const id = panel.target; panel = null; buildPanel(id); return; }
    const key = JSON.stringify(card);
    if (key === panel.cardKey) return;
    panel.cardKey = key;
    panel.update(card);

  // ---------- task / idea / create panel ----------

  function field(labelText, control, id) {
    const f = h('div', 'field');
    const l = h('label', null, labelText);
    l.htmlFor = id;
    control.id = id;
    f.append(l, control);
    return f;
  }
  function statusSelect() {
    const s = h('select', 'input');
    STATUSES.forEach((st) => { const o = h('option', null, label(st)); o.value = st; s.appendChild(o); });
    return s;
  }

  function buildTaskPanel(card) {
    const create = !card;
    const P = panel = { target: create ? 'new' : card.id, type: create ? 'create' : 'task', cardKey: card ? JSON.stringify(card) : '', confirmDelete: false, msg: '' };
    mountDrawer(P, false);

    P.base = create ? { title: '', note: '', status: 'new', kind: 'task' } : { title: card.title, note: card.note || '', status: card.status, kind: card.kind };
    P.baseUpdatedAt = card ? card.updatedAt : '';

    const head = h('div', 'dr-head');
    const headRowWrap = h('div');
    head.appendChild(headRowWrap);
    const title = h('h2', 'dr-title', create ? 'New card' : card.title);
    title.id = 'drawer-title';
    head.appendChild(title);
    const seenWrap = h('div');
    head.appendChild(seenWrap);

    const body = h('div', 'dr-body');
    const warnSlot = h('div');
    const conflict = h('div', 'callout warn');
    conflict.hidden = true;
    conflict.appendChild(h('span', 'grow', 'This card was changed on the board while you were editing. Saving will overwrite those changes.'));
    body.append(warnSlot, conflict);

    const fTitle = h('input', 'input');
    fTitle.type = 'text';
    fTitle.maxLength = 200;
    fTitle.value = P.base.title;
    fTitle.autocomplete = 'off';
    const titleErr = h('div', 'err');
    titleErr.hidden = true;
    titleErr.id = 'title-err';
    const fTitleWrap = field('Title', fTitle, 'f-title');
    fTitleWrap.appendChild(titleErr);
    const fNote = h('textarea', 'input');
    fNote.rows = 7;
    fNote.value = P.base.note;
    const fStatus = statusSelect();
    fStatus.value = P.base.status;
    body.appendChild(fTitleWrap);
    body.appendChild(field('Note', fNote, 'f-note'));
    let fKind = null;
    if (create) {
      fKind = h('select', 'input');
      ['task', 'idea'].forEach((k) => { const o = h('option', null, k); o.value = k; fKind.appendChild(o); });
      const row = h('div', 'row2');
      row.append(field('Status', fStatus, 'f-status'), field('Kind', fKind, 'f-kind'));
      body.appendChild(row);
    } else {
      body.appendChild(field('Status', fStatus, 'f-status'));
    }

    const metaKind = h('dd'), metaBy = h('dd'), metaCreated = h('dd'), metaUpdated = h('dd');
    if (!create) {
      const dl = h('dl', 'meta-grid');
      [['Kind', metaKind], ['Added by', metaBy], ['Created', metaCreated], ['Updated', metaUpdated]].forEach(([k, dd]) => { dl.appendChild(h('dt', null, k)); dl.appendChild(dd); });

      return create ? fKind.value !== P.base.kind : false;
    };
    P.initialFocus = () => (create ? fTitle : P.drawer);

    }

    function clearTitleErr() { titleErr.hidden = true; fTitle.removeAttribute('aria-invalid'); fTitle.removeAttribute('aria-describedby'); }

      const keep = plainBtn('Keep editing', 'small', () => { warnSlot.replaceChildren(); fTitle.focus(); });
      const discard = plainBtn('Discard changes', 'small danger', () => {

    function cancel() {

    function renderFoot(focusFirst) {

    async function doDelete(id) {

      await runAction('delete:' + id, async () => {
        try { await api('DELETE', '/api/cards/' + encodeURIComponent(id), {}); ok = true; }
        catch (e) { showError(e.message); P.confirmDelete = false; }

  }

  // ---------- thread panel ----------

  function copyText(text) {

  function legacyCopy(text) {

  }

  function sendBlock(card) {
    const t = card.thread;
    if (t.runState === 'ended') return 'This thread has ended, so it cannot take new messages.';
    if (t.runState === 'running') return 'A turn is still running. You can send a message when it finishes.';
    if (!t.sessionId) {
      return t.runState === 'failed'
        ? 'This thread never started a session because its first turn failed, so there is nothing to continue.'
        : 'This thread has no session id yet. You can send a message once its first turn has finished.';
    }
    return '';
  }

  const TABS = [['trace', 'Trace'], ['conversation', 'Conversation'], ['digest', 'Digest']];
  const traceHidden = {};   // kinds switched off in the Trace filters, kept across polls

  function buildThreadPanel(card) {
    const P = panel = {
      target: card.id, type: 'thread', cardKey: JSON.stringify(card), isDirty: null, tab: 'trace',
      confirm: null, keys: {}, scrollSaved: { trace: 0, conversation: 0, digest: 0 }, convAtBottom: true, scrollers: {},
    };
    KINDS.forEach((k) => { delete traceHidden[k]; });
    mountDrawer(P, true);

    const head = h('div', 'dr-head');
    const ids = h('details', 'ids');
    ids.open = window.innerHeight >= 900;   // short windows start collapsed to leave room for the thread
    const tabs = h('div', 'tabs');
    tabs.setAttribute('role', 'tablist');
    tabs.setAttribute('aria-label', 'Thread views');
    const panels = h('div', 'tabpanels');
    const foot = h('div', 'dr-foot');
    P.drawer.append(head, ids, tabs, panels, foot);

    // tabs
    const tabBtns = {}, tabPanels = {};
    TABS.forEach(([id, text]) => {
      const b = h('button', 'tab', text);
      b.type = 'button';
      b.id = 'tab-' + id;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-controls', 'tp-' + id);
      b.addEventListener('click', () => selectTab(id));
      b.addEventListener('keydown', (e) => {
        const i = TABS.findIndex((x) => x[0] === P.tab);
        let n = -1;
        if (e.key === 'ArrowRight') n = (i + 1) % TABS.length;
        else if (e.key === 'ArrowLeft') n = (i + TABS.length - 1) % TABS.length;
        else if (e.key === 'Home') n = 0;
        else if (e.key === 'End') n = TABS.length - 1;
        if (n < 0) return;
        e.preventDefault();
        selectTab(TABS[n][0]);
        tabBtns[TABS[n][0]].focus();
      });
      tabs.appendChild(b);
      tabBtns[id] = b;
      const p = h('div', 'tabpanel');
      p.id = 'tp-' + id;
      p.setAttribute('role', 'tabpanel');
      p.setAttribute('aria-labelledby', 'tab-' + id);
      panels.appendChild(p);
      tabPanels[id] = p;
    });
    const scTrace = h('div', 'scroller'); scTrace.tabIndex = 0; scTrace.setAttribute('aria-label', 'Trace');
    const scConvo = h('div', 'scroller'); scConvo.tabIndex = 0; scConvo.setAttribute('aria-label', 'Conversation');
    const scDigest = h('div', 'scroller'); scDigest.tabIndex = 0; scDigest.setAttribute('aria-label', 'Digest');
    const composer = h('div', 'composer');
    tabPanels.trace.appendChild(scTrace);
    tabPanels.conversation.append(scConvo, composer);
    tabPanels.digest.appendChild(scDigest);
    P.scrollers = { trace: scTrace, conversation: scConvo, digest: scDigest };
    Object.keys(P.scrollers).forEach((k) => {
      P.scrollers[k].addEventListener('scroll', () => {
        if (P.tab !== k || !P.scrollers[k].clientHeight) return;
        const s = P.scrollers[k];
        P.scrollSaved[k] = s.scrollTop;
        if (k === 'conversation') P.convAtBottom = s.scrollHeight - s.scrollTop - s.clientHeight < 80;
      });
    });

    function selectTab(id) {
      P.tab = id;
      TABS.forEach(([t]) => {
        const on = t === id;
        tabBtns[t].setAttribute('aria-selected', on ? 'true' : 'false');
        tabBtns[t].tabIndex = on ? 0 : -1;
        tabPanels[t].hidden = !on;
      });
      restoreScroll(id);
    }
    function restoreScroll(id) {
      const s = P.scrollers[id];
      if (id === 'conversation' && P.convAtBottom) s.scrollTop = s.scrollHeight;
      else s.scrollTop = P.scrollSaved[id];
    }
    // rebuild one scroller's content, keeping scroll position and focus
    function rebuild(id, build) {
      const s = P.scrollers[id];
      const a = document.activeElement;
      const fid = (a && s.contains(a) && a.dataset) ? a.dataset.fid : null;
      s.replaceChildren(...[].concat(build()));
      if (P.tab === id) restoreScroll(id);
      if (fid) { const t = s.querySelector('[data-fid="' + fid + '"]'); if (t) t.focus({ preventScroll: true }); }
    }

    // ----- header and ids -----
    function renderHead(c) {
      const t = c.thread;
      const wasOpen = ids.open;
      head.replaceChildren();
      head.appendChild(headRow(P, c, false));
      const title = h('h2', 'dr-title', c.title);
      title.id = 'drawer-title';
      head.appendChild(title);
      const sub = h('div', 'dr-sub');
      sub.appendChild(runPill(t.runState));
      sub.appendChild(h('span', null, t.mode === 'write' ? 'Can edit files' : 'Read-only'));
      const turns = turnsOf(c);
      const started = turns.length ? turns[0].startedAt : c.createdAt;
      const st = h('span'); st.append('Started ', timeEl(started));
      sub.appendChild(st);
      sub.appendChild(h('span', 'tnum', turns.length + (turns.length === 1 ? ' turn' : ' turns')));
      if (c.seenByClaude === false) {
        const u = h('span', 'unseen'); u.appendChild(shape('s-circle')); u.appendChild(h('span', null, 'Claude has not seen this yet'));
        sub.appendChild(u);
      }
      head.appendChild(sub);

      ids.replaceChildren();
      ids.open = wasOpen;
      const sum = h('summary', null, 'IDs');
      const peek = h('span', 'ids-peek', t.sessionId ? 'session ' + t.sessionId.slice(0, 8) + '\u2026 \u00b7 copy ids and resume command' : 'session id not known yet');
      sum.appendChild(peek);
      ids.appendChild(sum);
      const body = h('div', 'ids-body');
      const row = (k, v, what) => {
        body.appendChild(h('span', 'k', k));
        if (v) { body.appendChild(h('span', 'v', v)); body.appendChild(copyBtn(v, what)); }
        else { body.appendChild(h('span', 'muted', 'Not known yet')); body.appendChild(h('span')); }
      };
      row('Session id', t.sessionId, 'session id');
      row('Parent session id', t.parentSessionId, 'parent session id');
      if (t.sessionId) {
        row('Resume', 'claude --resume ' + t.sessionId, 'resume command');
        body.appendChild(h('p', 'ids-note', 'Run this in a terminal to open this thread as a normal conversation.'));
      }
      ids.appendChild(body);
    }

    // ----- trace -----
    function renderTrace(c) {
      const turns = turnsOf(c);
      const all = turns.map((t, i) => ({ t, i, state: turnState(c, i), steps: stepsOf(t) }));
      const counts = {};
      KINDS.forEach((k) => { counts[k] = 0; });
      all.forEach((x) => x.steps.forEach((s) => { counts[s.kind]++; }));
      const total = KINDS.reduce((n, k) => n + counts[k], 0);

      rebuild('trace', () => {
        const out = [];
        const filters = h('div', 'filters');
        filters.setAttribute('role', 'group');
        filters.setAttribute('aria-label', 'Show step kinds');
        KINDS.forEach((k) => {
          const b = h('button', 'fchip');
          b.type = 'button';
          b.dataset.kind = k;
          b.dataset.fid = 'f-' + k;
          b.setAttribute('aria-pressed', traceHidden[k] ? 'false' : 'true');
          b.appendChild(shape(KIND_SHAPE[k]));
          b.appendChild(h('span', null, KIND_LABEL[k]));
          b.appendChild(h('span', 'n tnum', String(counts[k])));
          b.addEventListener('click', () => {
            if (traceHidden[k]) delete traceHidden[k]; else traceHidden[k] = true;
            renderTrace(findCard(P.target) || c);
          });
          filters.appendChild(b);
        });
        out.push(filters);

        const anything = all.some((x) => x.steps.length || x.state === 'failed' || x.state === 'running');
        if (!anything) {
          const e = h('div', 'empty-state');
          e.appendChild(h('strong', null, 'No steps yet'));
          e.appendChild(document.createTextNode('Steps appear here once the thread reports back with what it did.'));
          out.push(e);
          return out;
        }
        all.forEach((x) => {
          const block = h('section', 'turn-block');
          const th = h('h3', 'turn-head');
          th.appendChild(h('span', 'tnum', 'Turn ' + (x.i + 1) + ' ·'));
          const tp = h('span', 'tp', firstLine(x.t.prompt) || '(no prompt)');
          tp.title = x.t.prompt || '';
          th.appendChild(tp);
          const when = h('span', 'when'); when.appendChild(timeEl(x.t.startedAt));
          th.appendChild(when);
          block.appendChild(th);

          const rail = h('ol', 'rail');
          const shown = x.steps.filter((s) => !traceHidden[s.kind]);
          shown.forEach((s) => rail.appendChild(stepEl(s.kind, s.text, s.ref)));
          if (x.state === 'failed') {
            const li = stepEl('error', x.t.error || 'The turn failed without an error message.');
            rail.appendChild(li);
          } else if (x.state === 'running') {
            const li = stepEl('working', '');
            const txt = li.querySelector('.step-text');
            txt.append('working… ', elapsedEl(x.t.startedAt));
            rail.appendChild(li);
          } else if (x.state === 'pending') {
            rail.appendChild(stepEl('working', 'No result was recorded for this turn.'));
          }
          if (!rail.childNodes.length) {
            const msg = x.steps.length ? 'All steps in this turn are hidden by the filters.' : 'This turn reported no steps.';
            block.appendChild(h('p', 'muted', msg));
          } else block.appendChild(rail);
          out.push(block);
        });
        return out;
      });
    }
    function stepEl(kind, text, ref) {
      const li = h('li', 'step' + (kind === 'error' ? ' err' : ''));
      li.dataset.kind = kind;
      const node = h('span', 'node' + (kind === 'error' ? ' err' : ''));
      node.appendChild(shape(kind === 'error' ? 's-cross' : kind === 'working' ? 's-pulse' : KIND_SHAPE[kind]));
      li.appendChild(node);
      const body = h('div', 'step-body');
      const top = h('div', 'step-top');
      top.appendChild(h('span', 'klabel', kind === 'error' ? 'Failed' : kind === 'working' ? 'Working' : KIND_LABEL[kind]));
      if (ref) top.appendChild(h('span', 'refchip', ref));
      body.appendChild(top);
      const tx = h('div', 'step-text');
      if (text) { if (kind === 'error') tx.textContent = text; else inline(tx, text); }
      body.appendChild(tx);
      li.appendChild(body);
      return li;
    }

    // ----- conversation -----
    function renderConvo(c) {
      const turns = turnsOf(c);
      rebuild('conversation', () => {
        const wrap = h('div', 'convo');
        if (!turns.length) wrap.appendChild(h('div', 'empty-state', 'No messages yet.'));
        turns.forEach((t, i) => {
          const st = turnState(c, i);
          const u = h('div', 'msg user');
          const um = h('div', 'msg-meta');
          um.appendChild(h('strong', null, i === 0 ? 'You · task' : 'You'));
          um.appendChild(timeEl(t.startedAt));
          u.appendChild(um);
          u.appendChild(h('div', 'bubble', t.prompt || ''));
          wrap.appendChild(u);

          const b = h('div', 'msg bot');
          const bm = h('div', 'msg-meta');
          bm.appendChild(h('strong', null, 'Thread'));
          bm.appendChild(h('span', 'tnum', 'turn ' + (i + 1)));
          if (t.finishedAt && t.startedAt) bm.appendChild(h('span', 'tnum', 'took ' + fmtMs(new Date(t.finishedAt) - new Date(t.startedAt))));
          b.appendChild(bm);
          if (st === 'running') {
            const ty = h('div', 'typing');
            ty.setAttribute('role', 'status');
            const dots = h('span', 'dots'); dots.append(h('i'), h('i'), h('i'));
            ty.appendChild(dots);
            const tx = h('span'); tx.append('Working · ', elapsedEl(t.startedAt));
            ty.appendChild(tx);
            b.appendChild(ty);
          } else if (st === 'failed') {
            const co = h('div', 'callout danger');
            co.appendChild(h('div', 'callout-title', 'This turn failed'));
            co.appendChild(h('div', 'callout-body', t.error || 'No error message was recorded.'));
            b.appendChild(co);
          } else if (st === 'ok' && typeof t.result === 'string') {
            const v = viewOf(t);
            const bub = h('div', 'bubble');
            if (v && v.body) bub.appendChild(renderMarkdown(v.body));
            if (v) SECTIONS.forEach(([key, name, kind]) => {
              const txt = v.sections && v.sections[key];
              if (!txt || !txt.trim() || !itemsOf(txt).length) return;
              const s = h('section');
              s.dataset.kind = kind;
              const st2 = h('h4', 'sec-title'); st2.appendChild(shape(KIND_SHAPE[kind])); st2.appendChild(h('span', null, name));
              s.append(st2, renderMarkdown(txt));
              bub.appendChild(s);
            });
            if (!bub.childNodes.length) bub.appendChild(h('span', 'muted', 'The reply was empty.'));
            b.appendChild(bub);
          } else {
            b.appendChild(h('div', 'typing', 'No result was recorded for this turn.'));
          }
          wrap.appendChild(b);
        });
        return wrap;
      });
    }

    // ----- composer -----
    const ta = h('textarea', 'input');
    ta.rows = 2;
    ta.id = 'composer-input';
    ta.setAttribute('aria-label', 'Message to this thread');
    ta.setAttribute('aria-describedby', 'composer-reason');
    ta.placeholder = 'Message the thread…';
    ta.value = drafts[card.id] || '';
    ta.addEventListener('input', () => { drafts[card.id] = ta.value; updateSendOff(); });
    const reasonEl = h('div', 'reason');
    reasonEl.id = 'composer-reason';
    const sendBtn = actionBtn('Send', 'primary', 'send:' + card.id, () => send());
    const hint = h('span', 'foot-note', 'Ctrl or Cmd + Enter to send');
    const crow = h('div', 'composer-row');
    crow.append(reasonEl, sendBtn);
    composer.append(ta, crow);
    function updateSendOff() { setOff(sendBtn, ta.disabled || !ta.value.trim()); }
    function renderComposer(c) {
      const why = sendBlock(c);
      ta.disabled = !!why;
      reasonEl.className = 'reason' + (why ? ' blocked' : '');
      reasonEl.replaceChildren();
      if (why) reasonEl.textContent = why; else reasonEl.appendChild(hint);
      updateSendOff();
    }
    async function send() {
      const text = ta.value.trim();
      if (!text) return;
      clearError();
      await runAction('send:' + card.id, async () => {
        try {
          const updated = await api('POST', '/api/threads/' + encodeURIComponent(card.id) + '/messages', { message: text });
          if (ta.value.trim() === text) { ta.value = ''; drafts[card.id] = ''; }
          P.convAtBottom = true;
          applyCard(updated);
        } catch (e) { showError(e.message); }
      });
      poll();
    }
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !e.isComposing) { e.preventDefault(); if (!sendBtn.disabled) send(); }
    });

    // ----- digest -----
    function renderDigest(c) {
      const turns = turnsOf(c);
      let newest = -1;
      turns.forEach((t, i) => { if (t.ok === true && typeof t.result === 'string') newest = i; });
      rebuild('digest', () => {
        const out = [];
        if (newest < 0) {
          const e = h('div', 'empty-state');
          e.appendChild(h('strong', null, 'No digest yet'));
          e.appendChild(document.createTextNode(turns.length ? 'None of this thread’s turns has finished successfully.' : 'The digest appears when the first turn finishes.'));
          out.push(e);
          return out;
        }
        const t = turns[newest];
        const v = viewOf(t);
        const top = h('div', 'dg-top');
        top.appendChild(h('strong', null, 'Turn ' + (newest + 1) + (newest === turns.length - 1 ? ' (newest)' : ' (newest successful)')));
        top.appendChild(timeEl(t.finishedAt || t.startedAt));
        out.push(top);
        const grid = h('div', 'dg-grid');
        SECTIONS.forEach(([key, name, kind]) => {
          const b = h('section', 'dg-block');
          b.dataset.kind = kind;
          const hh = h('h4', 'sec-title'); hh.appendChild(shape(KIND_SHAPE[kind])); hh.appendChild(h('span', null, name));
          b.appendChild(hh);
          const txt = v && v.sections ? v.sections[key] : '';
          if (txt && txt.trim() && itemsOf(txt).length) b.appendChild(renderMarkdown(txt));
          else b.appendChild(h('div', 'none', 'Nothing reported.'));
          grid.appendChild(b);
        });
        out.push(grid);

        out.push(h('h3', 'dg-h', 'All decisions'));
        const decisions = [];
        turns.forEach((tt, i) => {
          if (!(tt.ok === true && typeof tt.result === 'string')) return;
          let items = itemsOf((viewOf(tt).sections || {}).decided);
          if (!items.length) items = stepsOf(tt).filter((s) => s.kind === 'decided').map((s) => s.text);
          items.forEach((text) => decisions.push({ n: i + 1, text }));
        });
        if (!decisions.length) out.push(h('p', 'muted', 'No decisions recorded in any turn.'));
        else {
          const ul = h('ul', 'decisions');
          decisions.forEach((d) => {
            const li = h('li');
            li.appendChild(h('span', 'tn', 'Turn ' + d.n));
            li.appendChild(inlineEl('span', null, d.text));
            ul.appendChild(li);
          });
          out.push(ul);
        }

        const note = h('div', 'callout report-note');
        if (c.thread.reported) {
          note.appendChild(h('span', 'grow', 'This result has been reported to the main session.'));
        } else {
          const sp = h('span', 'grow');
          sp.append('Not reported yet. Run ');
          sp.appendChild(h('code', null, '/thread:report ' + c.id));
          sp.append(' in the main session to bring this into its context.');
          note.classList.add('warn');
          note.appendChild(sp);
        }
        out.push(note);
        return out;
      });
    }

    // ----- footer -----
    function renderFoot(c, focusFirst) {
      const t = c.thread;
      foot.replaceChildren();
      const running = t.runState === 'running';
      if (P.confirm === 'end') {
        foot.appendChild(h('span', 'confirm-text', 'End this thread? It stops taking messages and the card moves to Done.'));
        foot.appendChild(h('span', 'grow'));
        const keep = plainBtn('Keep it open', null, () => { P.confirm = null; renderFoot(findCard(P.target) || c, true); });
        foot.append(keep, actionBtn('End thread', 'danger solid', 'end:' + c.id, doEnd));
        if (focusFirst) keep.focus();
      } else if (P.confirm === 'delete') {
        foot.appendChild(h('span', 'confirm-text', 'Delete ' + c.id + ' and its history? This cannot be undone.'));
        foot.appendChild(h('span', 'grow'));
        const keep = plainBtn('Keep it', null, () => { P.confirm = null; renderFoot(findCard(P.target) || c, true); });
        foot.append(keep, actionBtn('Delete card', 'danger solid', 'delete:' + c.id, doDelete));
        if (focusFirst) keep.focus();
      } else {
        if (t.runState !== 'ended') {
          const end = plainBtn('End thread', null, () => { P.confirm = 'end'; renderFoot(findCard(P.target) || c, true); });
          foot.appendChild(end);
        }
        foot.appendChild(h('span', 'grow'));
        const del = plainBtn('Delete', 'danger', () => { if (running) return; P.confirm = 'delete'; renderFoot(findCard(P.target) || c, true); });
        if (running) {
          del.disabled = true;
          del.title = 'A turn is running. End the thread or wait for it to finish before deleting.';
          foot.appendChild(h('span', 'foot-note', 'Delete is unavailable while a turn is running.'));
        }
        foot.appendChild(del);
      }
      syncBusy();
    }
    async function doEnd() {
      clearError();
      await runAction('end:' + card.id, async () => {
        try { const updated = await api('POST', '/api/threads/' + encodeURIComponent(card.id) + '/end', {}); P.confirm = null; applyCard(updated); }
        catch (e) { showError(e.message); P.confirm = null; }
      });
      if (panel === P) renderFoot(findCard(P.target) || card);
      poll();
    }
    async function doDelete() {
      clearError();
      let ok = false;
      await runAction('delete:' + card.id, async () => {
        try { await api('DELETE', '/api/cards/' + encodeURIComponent(card.id), {}); ok = true; }
        catch (e) { showError(e.message); P.confirm = null; }
      });
      if (ok && panel === P) {
        const cards = current.cards.filter((x) => x.id !== card.id);
        appliedSeq = ++pollSeq; lastRaw = null;
        current = Object.assign({}, current, { cards }); currentKey = JSON.stringify(current);
        returnFocus = { el: elNewBtn };
        navigateClose();
        renderBoard(false);
      } else if (panel === P) renderFoot(findCard(P.target) || card);
      poll();
    }

    // ----- update from polling -----
    P.update = (c) => {
      if (!isThread(c)) return;
      const t = c.thread, turns = turnsOf(c);
      const k = {
        head: JSON.stringify([c.title, t.runState, t.mode, t.sessionId, t.parentSessionId, turns.length, turns[0] && turns[0].startedAt, c.seenByClaude]),
        trace: JSON.stringify([turns, t.runState]),
        convo: JSON.stringify([turns, t.runState]),
        digest: JSON.stringify([turns, t.reported]),
        composer: t.runState + '|' + t.sessionId,
        foot: t.runState,
      };
      if (k.head !== P.keys.head) { renderHead(c); P.keys.head = k.head; }
      if (k.trace !== P.keys.trace) { renderTrace(c); P.keys.trace = k.trace; }
      if (k.convo !== P.keys.convo) { renderConvo(c); P.keys.convo = k.convo; }
      if (k.digest !== P.keys.digest) { renderDigest(c); P.keys.digest = k.digest; }
      if (k.composer !== P.keys.composer) { renderComposer(c); P.keys.composer = k.composer; }
      if (k.foot !== P.keys.foot) {
        P.keys.foot = k.foot;
        if (t.runState === 'ended' && P.confirm === 'end') P.confirm = null;
        if (t.runState === 'running' && P.confirm === 'delete') P.confirm = null;
        renderFoot(c);
      }
    };

    selectTab('trace');
    P.update(card);
    renderFoot(card);
    P.initialFocus = () => P.drawer;
  }

  // ---------- global keys ----------

  function trapList() {
    const sel = 'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), summary, [tabindex="0"]';
    const list = Array.from(panel.drawer.querySelectorAll(sel)).filter((e) => e.tabIndex >= 0 && !e.closest('[hidden]') && e.getClientRects().length);
    if (!elBanner.hidden) list.push($('banner-close'));
    return list;
  }

  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.isComposing) return;
    if (panel) {
      if (e.key === 'Escape') { e.preventDefault(); requestClose(); return; }
      if (e.key === 'Tab') {
        const list = trapList();
        if (!list.length) { e.preventDefault(); return; }
        const first = list[0], last = list[list.length - 1], a = document.activeElement;
        const inside = panel.drawer.contains(a) || a === $('banner-close');
        if (!inside) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && (a === first || a === panel.drawer)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(e.target)) return;
    if (e.key === '/') { e.preventDefault(); elSearch.focus(); elSearch.select(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNew(); }
  });

  // ---------- start ----------

  (async function loop() {
    await poll();
    setTimeout(loop, POLL_MS);
  })();
})();
</script>
</body>
